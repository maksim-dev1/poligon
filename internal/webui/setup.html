<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>poligon — установка пароля</title>
<link rel="stylesheet" href="/app.css">
</head>
<body>
<div class="auth-wrap">
  <form class="auth-card" id="box" onsubmit="submitPw();return false">
    <span class="wordmark">poligon</span>
    <h1>Задайте пароль</h1>
    <p class="sub">для <b id="who" style="color:var(--text-2)">…</b></p>
    <label class="field">
      <span class="field-label">Новый пароль <span style="color:var(--text-muted)">· не короче 10 символов</span></span>
      <input id="p1" class="input" type="password" autocomplete="new-password" placeholder="••••••••••">
    </label>
    <label class="field">
      <span class="field-label">Повторите пароль</span>
      <input id="p2" class="input" type="password" autocomplete="new-password" placeholder="••••••••••">
    </label>
    <button id="go" class="btn btn--primary btn--block" type="submit">Сохранить и войти</button>
    <div class="form-error" id="err"></div>
  </form>
</div>

<script>
const t = new URLSearchParams(location.search).get("t") || "";
const err = document.getElementById("err");

async function load() {
  if (!t) { fail("В ссылке нет токена."); return; }
  const r = await fetch("/auth/setup/check?t=" + encodeURIComponent(t));
  if (!r.ok) { fail("Ссылка недействительна или уже использована."); return; }
  document.getElementById("who").textContent = (await r.json()).email;
  document.getElementById("p1").focus();
}

async function submitPw() {
  const p1 = document.getElementById("p1").value, p2 = document.getElementById("p2").value;
  err.textContent = "";
  if (p1.length < 10) { err.textContent = "Пароль должен быть не короче 10 символов."; return; }
  if (p1 !== p2) { err.textContent = "Пароли не совпадают."; return; }
  document.getElementById("go").disabled = true;
  const r = await fetch("/auth/setup", {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ t, password: p1 }),
  });
  if (r.ok) { location.href = "/"; return; }
  document.getElementById("go").disabled = false;
  const b = await r.json().catch(() => ({}));
  err.textContent = b.error || "Не удалось задать пароль.";
}

function fail(m) {
  document.getElementById("box").innerHTML =
    '<span class="wordmark">poligon</span><h1>Не удаётся задать пароль</h1><p class="sub">' + m + '</p>';
}

load();
</script>
</body>
</html>
