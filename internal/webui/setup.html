<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>poligon — set password</title>
<link rel="stylesheet" href="/app.css">
</head>
<body>
<div class="auth-wrap">
  <form class="auth-card" id="box" onsubmit="submitPw();return false">
    <span class="wordmark">poligon</span>
    <h1>Set your password</h1>
    <p class="sub">for <b id="who" style="color:var(--text-2)">…</b></p>
    <label class="field">
      <span class="field-label">New password <span style="color:var(--text-muted)">· at least 10 characters</span></span>
      <input id="p1" class="input" type="password" autocomplete="new-password" placeholder="••••••••••">
    </label>
    <label class="field">
      <span class="field-label">Repeat password</span>
      <input id="p2" class="input" type="password" autocomplete="new-password" placeholder="••••••••••">
    </label>
    <button id="go" class="btn btn--primary btn--block" type="submit">Save &amp; sign in</button>
    <div class="form-error" id="err"></div>
  </form>
</div>

<script>
const t = new URLSearchParams(location.search).get("t") || "";
const err = document.getElementById("err");

async function load() {
  if (!t) { fail("Missing link token."); return; }
  const r = await fetch("/auth/setup/check?t=" + encodeURIComponent(t));
  if (!r.ok) { fail("This link is invalid or already used."); return; }
  document.getElementById("who").textContent = (await r.json()).email;
  document.getElementById("p1").focus();
}

async function submitPw() {
  const p1 = document.getElementById("p1").value, p2 = document.getElementById("p2").value;
  err.textContent = "";
  if (p1.length < 10) { err.textContent = "Password must be at least 10 characters."; return; }
  if (p1 !== p2) { err.textContent = "Passwords don't match."; return; }
  document.getElementById("go").disabled = true;
  const r = await fetch("/auth/setup", {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ t, password: p1 }),
  });
  if (r.ok) { location.href = "/"; return; }
  document.getElementById("go").disabled = false;
  const b = await r.json().catch(() => ({}));
  err.textContent = b.error || "Could not set password.";
}

function fail(m) {
  document.getElementById("box").innerHTML =
    '<span class="wordmark">poligon</span><h1>Can’t set password</h1><p class="sub">' + m + '</p>';
}

document.getElementById("p2").addEventListener("keydown", e => { if (e.key === "Enter") submitPw(); });
load();
</script>
</body>
</html>
