<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>терминал</title>
<link rel="stylesheet" href="/app.css">
<link rel="stylesheet" href="/vendor/xterm.css">
<style>
  html, body { height: 100%; }
  body { margin: 0; display: flex; flex-direction: column; background: #000; overflow: hidden; }
  .bar {
    flex: none; display: flex; align-items: center; gap: 8px;
    padding: 6px 10px; background: var(--surface-2); border-bottom: 1px solid var(--line);
    font: 500 11px/1 var(--mono); color: var(--text-muted);
  }
  .bar .sp { margin-left: auto; }
  .bar .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--down); flex: none; }
  .bar .dot.up { background: var(--ok); }
  #term { flex: 1; min-height: 0; padding: 8px; }
</style>
</head>
<body>
<div class="bar">
  <span class="dot" id="dot"></span><span id="status">подключение…</span>
  <span class="sp"></span>
  <button class="btn btn--sm" id="reconnect" hidden onclick="connect()">Переподключить</button>
</div>
<div id="term"></div>
<script src="/vendor/xterm.js"></script>
<script src="/vendor/xterm-addon-fit.js"></script>
<script>
const id = new URLSearchParams(location.search).get("id");
document.title = "терминал — " + (id || "?");

const term = new Terminal({ fontSize: 13, cursorBlink: true, theme: { background: "#000" } });
const fit = new FitAddon.FitAddon();
term.loadAddon(fit);
term.open(document.getElementById("term"));
fit.fit();
window.addEventListener("resize", () => fit.fit());

const status = document.getElementById("status");
const dot = document.getElementById("dot");
let ws;
function connect() {
  if (!id) { status.textContent = "нет id устройства"; return; }
  const scheme = location.protocol === "https:" ? "wss" : "ws";
  ws = new WebSocket(`${scheme}://${location.host}/api/devices/${id}/shell`);
  ws.binaryType = "arraybuffer";
  // a closed shell used to leave a dead black rectangle with no way back
  const reconnect = document.getElementById("reconnect");
  ws.onopen = () => {
    status.textContent = id + " — подключено";
    dot.classList.add("up");
    reconnect.hidden = true;
    term.focus();
  };
  ws.onclose = () => {
    status.textContent = "сессия завершена";
    dot.classList.remove("up");
    reconnect.hidden = false;
  };
  ws.onerror = () => { status.textContent = "ошибка соединения"; reconnect.hidden = false; };
  ws.onmessage = ev => term.write(ev.data instanceof ArrayBuffer ? new Uint8Array(ev.data) : ev.data);
}
term.onData(d => { if (ws && ws.readyState === WebSocket.OPEN) ws.send(d); });
connect();
window.addEventListener("pagehide", () => { try { ws && ws.close(); } catch {} });
</script>
</body>
</html>
