<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>приложения</title>
<link rel="stylesheet" href="/app.css">
<style>
  html, body { height: 100%; }
  body { margin: 0; display: flex; flex-direction: column; overflow: hidden; }
  .toolbar { flex: none; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; padding: 8px 10px; background: var(--surface-2); border-bottom: 1px solid var(--line); }
  .toolbar .search { flex: 1; min-width: 140px; }
  .settings-row { flex: none; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; padding: 8px 10px; border-bottom: 1px solid var(--line); }
  .settings-row .label { color: var(--text-muted); font: 500 11px/1 var(--mono); margin-right: 4px; }
  .list { flex: 1; overflow: auto; }
  .row { display: flex; align-items: center; gap: 8px; padding: 7px 12px; border-bottom: 1px solid var(--line); font: 400 12px/1.3 var(--mono); }
  .row:hover { background: var(--surface-2); }
  .row .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text); }
  .row .tag { flex: none; font-size: 10px; color: var(--text-muted); border: 1px solid var(--line-2); border-radius: var(--r-xs); padding: 1px 5px; }
  .row .rowbtn { flex: none; }
  .empty { padding: 24px; text-align: center; color: var(--text-muted); font: 400 12px/1.4 var(--mono); }
</style>
</head>
<body>
<div class="settings-row">
  <span class="label">Настройки:</span>
  <button class="btn btn--sm" onclick="openSettings('wifi')">Wi-Fi</button>
  <button class="btn btn--sm" onclick="openSettings('bluetooth')">Bluetooth</button>
  <button class="btn btn--sm" onclick="openSettings('display')">Экран</button>
  <button class="btn btn--sm" onclick="openSettings('battery')">Батарея</button>
  <button class="btn btn--sm" onclick="openSettings('datetime')">Дата/время</button>
  <button class="btn btn--sm" onclick="openSettings('location')">Локация</button>
  <button class="btn btn--sm" onclick="openSettings('developer')">Для разработчиков</button>
</div>
<div class="toolbar">
  <input class="select search" id="search" placeholder="фильтр по имени пакета…" oninput="renderList()">
  <label style="display:flex;align-items:center;gap:6px;font:400 12px/1 var(--mono);color:var(--text-2)">
    <input type="checkbox" id="showSystem" onchange="loadApps()"> системные
  </label>
  <button class="btn btn--sm" onclick="loadApps()">Обновить</button>
</div>
<div class="list" id="list"></div>
<div class="toasts" id="toasts"></div>
<script>
const id = new URLSearchParams(location.search).get("id");
const csrf = () => (document.cookie.match(/(?:^|;\s*)poligon_csrf=([^;]+)/) || [])[1] || "";
const HW = () => ({ "X-Poligon-CSRF": csrf(), "Content-Type": "application/json" });

function toast(msg, kind) {
  const el = document.createElement("div");
  el.className = "toast" + (kind ? " toast--" + kind : "");
  el.textContent = msg;
  document.getElementById("toasts").appendChild(el);
  setTimeout(() => { el.style.transition = "opacity .2s"; el.style.opacity = "0"; setTimeout(() => el.remove(), 220); }, kind === "err" ? 6000 : 3500);
}
function esc(s) { return String(s ?? "").replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;" }[c])); }

let apps = [];
async function loadApps() {
  if (!id) { document.getElementById("list").innerHTML = `<div class="empty">нет id устройства</div>`; return; }
  const all = document.getElementById("showSystem").checked ? "1" : "0";
  try {
    const r = await fetch(`/api/devices/${id}/apps?all=${all}`);
    const b = await r.json();
    if (!r.ok) throw new Error(b.error || r.statusText);
    apps = b.packages || [];
    renderList();
  } catch (e) { toast(e.message, "err"); }
}
function renderList() {
  const q = document.getElementById("search").value.toLowerCase();
  const filtered = apps.filter(a => a.name.toLowerCase().includes(q)).sort((a, b) => a.name.localeCompare(b.name));
  const list = document.getElementById("list");
  if (!filtered.length) { list.innerHTML = `<div class="empty">ничего не найдено</div>`; return; }
  list.innerHTML = filtered.map(a => `
    <div class="row">
      <span class="name" title="${esc(a.name)}">${esc(a.name)}</span>
      ${a.system ? `<span class="tag">системное</span>` : ""}
      <button class="icon-btn rowbtn" title="Запустить" onclick="appAction('launch','${a.name}')">▶</button>
      <button class="icon-btn rowbtn" title="Force stop" onclick="appAction('force-stop','${a.name}')">⏹</button>
      <button class="icon-btn rowbtn" title="Очистить данные" onclick="appAction('clear-data','${a.name}',true)">⟲</button>
      <button class="icon-btn rowbtn is-danger" title="Удалить" onclick="appAction('uninstall','${a.name}',true)">✕</button>
    </div>`).join("");
}
async function appAction(action, pkg, confirmFirst) {
  if (confirmFirst && !confirm(`${action === "uninstall" ? "Удалить" : "Очистить данные"} ${pkg}?`)) return;
  try {
    const r = await fetch(`/api/devices/${id}/apps/${action}`, { method: "POST", headers: HW(), body: JSON.stringify({ package: pkg }) });
    const b = await r.json();
    if (!r.ok) throw new Error(b.error || r.statusText);
    toast("Готово", "ok");
    if (action === "uninstall") loadApps();
  } catch (e) { toast(e.message, "err"); }
}
async function openSettings(screen) {
  try {
    const r = await fetch(`/api/devices/${id}/settings`, { method: "POST", headers: HW(), body: JSON.stringify({ screen }) });
    const b = await r.json();
    if (!r.ok) throw new Error(b.error || r.statusText);
  } catch (e) { toast(e.message, "err"); }
}
loadApps();
</script>
</body>
</html>
