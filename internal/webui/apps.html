<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>приложения</title>
<link rel="stylesheet" href="/app.css">
<style>
  html, body { height: 100%; }
  body { margin: 0; display: flex; flex-direction: column; overflow: hidden; }
  .section { flex: none; border-bottom: 1px solid var(--line); }
  .section-head { display: flex; align-items: baseline; gap: 8px; padding: 10px 12px 4px; }
  .section-head h2 { margin: 0; font: 600 12px/1.2 var(--sans); color: var(--text); }
  .section-head .hint { font: 400 11px/1.4 var(--sans); color: var(--text-muted); }
  .settings-row { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; padding: 6px 12px 12px; }
  .toolbar { flex: none; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 10px 12px; background: var(--surface-2); border-bottom: 1px solid var(--line); }
  .toolbar .search { flex: 1; min-width: 140px; }
  .toolbar label { display: flex; align-items: center; gap: 6px; font: 400 12px/1 var(--sans); color: var(--text-2); white-space: nowrap; }
  .list { flex: 1; overflow: auto; }
  .row { display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-bottom: 1px solid var(--line); }
  .row:hover { background: var(--surface-2); }
  .row .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font: 400 12px/1.3 var(--mono); color: var(--text); }
  .row .tag { flex: none; font: 500 10px/1 var(--sans); color: var(--text-muted); border: 1px solid var(--line-2); border-radius: var(--r-xs); padding: 2px 6px; }
  .row .actions { flex: none; display: flex; gap: 4px; }
  .row .actions .btn { font-size: 11px; height: 24px; padding: 0 8px; }
  .empty { padding: 24px; text-align: center; color: var(--text-muted); font: 400 12px/1.4 var(--sans); }
</style>
</head>
<body>
<div class="section">
  <div class="section-head"><h2>Настройки устройства</h2><span class="hint">— прямой переход на экран настроек, без навигации руками</span></div>
  <div class="settings-row">
    <button class="btn btn--sm" onclick="openSettings('wifi')">Wi-Fi</button>
    <button class="btn btn--sm" onclick="openSettings('bluetooth')">Bluetooth</button>
    <button class="btn btn--sm" onclick="openSettings('display')">Экран</button>
    <button class="btn btn--sm" onclick="openSettings('battery')">Батарея</button>
    <button class="btn btn--sm" onclick="openSettings('datetime')">Дата/время</button>
    <button class="btn btn--sm" onclick="openSettings('location')">Локация</button>
    <button class="btn btn--sm" onclick="openSettings('developer')">Для разработчиков</button>
  </div>
</div>
<div class="section-head"><h2>Приложения</h2><span class="hint">— действия применяются на устройстве сразу, без подтверждения на экране</span></div>
<div class="toolbar">
  <input class="select search" id="search" placeholder="фильтр по имени пакета…" oninput="renderList()">
  <label><input type="checkbox" id="showSystem" onchange="loadApps()"> показывать системные</label>
  <button class="btn btn--sm" onclick="loadApps()">Обновить список</button>
</div>
<div class="list" id="list"></div>
<div class="toasts" id="toasts"></div>
<script>
const id = new URLSearchParams(location.search).get("id");
const csrf = () => (document.cookie.match(/(?:^|;\s*)poligon_csrf=([^;]+)/) || [])[1] || "";
const HW = () => ({ "X-Poligon-CSRF": csrf(), "Content-Type": "application/json" });

function toast(msg, kind) {
  const el = document.createElement("div");
  el.className = "toast" + (kind ? " toast--" + kind : "");
  el.textContent = msg;
  document.getElementById("toasts").appendChild(el);
  setTimeout(() => { el.style.transition = "opacity .2s"; el.style.opacity = "0"; setTimeout(() => el.remove(), 220); }, kind === "err" ? 6000 : 3500);
}
function esc(s) { return String(s ?? "").replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;" }[c])); }

let apps = [];
async function loadApps() {
  if (!id) { document.getElementById("list").innerHTML = `<div class="empty">нет id устройства</div>`; return; }
  document.getElementById("list").innerHTML = `<div class="empty">загружаю…</div>`;
  const all = document.getElementById("showSystem").checked ? "1" : "0";
  try {
    const r = await fetch(`/api/devices/${id}/apps?all=${all}`);
    const b = await r.json();
    if (!r.ok) throw new Error(b.error || r.statusText);
    apps = b.packages || [];
    renderList();
  } catch (e) {
    toast(e.message, "err");
    document.getElementById("list").innerHTML = `<div class="empty">не удалось получить список: ${esc(e.message)}</div>`;
  }
}
function renderList() {
  const q = document.getElementById("search").value.toLowerCase();
  const filtered = apps.filter(a => a.name.toLowerCase().includes(q)).sort((a, b) => a.name.localeCompare(b.name));
  const list = document.getElementById("list");
  if (!apps.length) {
    list.innerHTML = `<div class="empty">сторонних приложений не найдено — включите «показывать системные», если ищете предустановленное</div>`;
    return;
  }
  if (!filtered.length) { list.innerHTML = `<div class="empty">ничего не найдено по «${esc(q)}»</div>`; return; }
  list.innerHTML = filtered.map(a => `
    <div class="row">
      <span class="name" title="${esc(a.name)}">${esc(a.name)}</span>
      ${a.system ? `<span class="tag">системное</span>` : ""}
      <div class="actions">
        <button class="btn" title="Запустить приложение" onclick="appAction('launch','${a.name}')">Запустить</button>
        <button class="btn" title="Убить все процессы приложения" onclick="appAction('force-stop','${a.name}')">Стоп</button>
        <button class="btn" title="Стереть данные и кэш — как переустановка начисто" onclick="appAction('clear-data','${a.name}',true)">Очистить</button>
        <button class="btn btn--danger" title="Удалить приложение с устройства" onclick="appAction('uninstall','${a.name}',true)">Удалить</button>
      </div>
    </div>`).join("");
}
async function appAction(action, pkg, confirmFirst) {
  const labels = { launch: "запущено", "force-stop": "остановлено", "clear-data": "данные очищены", uninstall: "удалено" };
  if (confirmFirst) {
    const q = action === "uninstall" ? `Удалить ${pkg} с устройства?` : `Очистить данные и кэш ${pkg}? Приложение как будто только что установлено.`;
    if (!confirm(q)) return;
  }
  try {
    const r = await fetch(`/api/devices/${id}/apps/${action}`, { method: "POST", headers: HW(), body: JSON.stringify({ package: pkg }) });
    const b = await r.json();
    if (!r.ok) throw new Error(b.error || r.statusText);
    toast(`${pkg}: ${labels[action] || "готово"}`, "ok");
    if (action === "uninstall") loadApps();
  } catch (e) { toast(`${pkg}: ${e.message}`, "err"); }
}
async function openSettings(screen) {
  try {
    const r = await fetch(`/api/devices/${id}/settings`, { method: "POST", headers: HW(), body: JSON.stringify({ screen }) });
    const b = await r.json();
    if (!r.ok) throw new Error(b.error || r.statusText);
  } catch (e) { toast(e.message, "err"); }
}
loadApps();
</script>
</body>
</html>
