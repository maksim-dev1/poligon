<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>poligon — прогоны тестов</title>
<link rel="stylesheet" href="/app.css">
<style>
  .page-head { padding: 14px 18px 4px; max-width: 900px; }
  .page-head h1 { margin: 0; font: 600 16px/1.3 var(--sans); color: var(--text); }
  .page-head .sub { margin-top: 4px; font: 400 12.5px/1.5 var(--sans); color: var(--text-muted); max-width: 640px; }
  .runs { padding: 12px 18px 96px; display: grid; gap: 10px; max-width: 900px; }
  .run {
    background: var(--surface); border: 1px solid var(--line);
    border-radius: var(--r-md); overflow: hidden;
  }
  .run-head {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 12px; cursor: pointer;
    font: 500 12px/1.3 var(--mono);
  }
  .run-head:hover { background: var(--surface-2); }
  .run-head .chevron { flex: none; color: var(--text-muted); transition: transform .12s var(--ease); }
  .run-head .chevron.open { transform: rotate(90deg); }
  .run-head .type-icon { flex: none; width: 22px; height: 22px; border-radius: var(--r-xs); background: var(--inset); display: grid; place-items: center; color: var(--text-2); }
  .run-head .type-icon svg { width: 12px; height: 12px; }
  .run-type { color: var(--text); font-weight: 600; }
  .run-id { color: var(--text-muted); font-weight: 400; }
  .run-when { color: var(--text-muted); margin-left: auto; font-size: 11px; text-align: right; white-space: nowrap; }
  .run-act { display: flex; gap: 6px; }
  .run-act .btn { height: 22px; padding: 0 8px; font-size: 11px; }
  .run-devs { border-top: 1px solid var(--line); padding: 4px 0; }
  .run-devs-head { padding: 6px 12px; font: 500 10px/1 var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--text-muted); }
  .run-dev {
    display: grid; grid-template-columns: 1fr auto;
    gap: 4px 12px; padding: 8px 12px;
    font: 400 12px/1.4 var(--mono);
    border-top: 1px solid var(--line);
  }
  .run-dev:first-child { border-top: 0; }
  .run-dev .did { color: var(--text-2); }
  .run-dev .ddetail { color: var(--text-muted); grid-column: 1 / -1; white-space: pre-wrap; }
  .run-dev .darts { grid-column: 1 / -1; display: flex; gap: 10px; flex-wrap: wrap; }
  .pill {
    display: inline-flex; align-items: center; gap: 6px;
    font: 600 11px/1 var(--mono); letter-spacing: 0.06em; text-transform: uppercase;
    padding: 3px 7px; border-radius: var(--r-xs); border: 1px solid var(--line-2);
    color: var(--text-2); white-space: nowrap;
  }
  .pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--text-muted); }
  .pill.passed  { color: var(--ok); border-color: rgba(63,185,138,.35); }
  .pill.passed::before { background: var(--ok); }
  .pill.failed, .pill.error { color: var(--down); border-color: rgba(229,84,75,.35); }
  .pill.failed::before, .pill.error::before { background: var(--down); }
  .pill.running, .pill.queued { color: var(--warn); border-color: rgba(217,154,43,.35); }
  .pill.running::before, .pill.queued::before { background: var(--warn); }
  .pill.canceled, .pill.skipped, .pill.pending { color: var(--text-muted); }
  .empty2 { padding: 40px 18px; text-align: center; color: var(--text-3); max-width: 420px; margin: 0 auto; }
  .empty2 .big { font: 500 13px/1.4 var(--sans); color: var(--text-2); margin-bottom: 6px; }
  .runs-filterbar {
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    padding: 10px 18px; max-width: 900px;
  }
  .runs-filterbar .sp { margin-left: auto; }
  .runs-pager { display: flex; align-items: center; gap: 8px; font: 400 12px/1 var(--mono); color: var(--text-2); }
  .runs-pager .btn { height: 24px; padding: 0 10px; font-size: 11px; }
</style>
</head>
<body>
<header class="topbar">
  <span class="wordmark">poligon</span>
  <span class="readout">прогоны тестов</span>
  <span class="spacer"></span>
  <button class="btn btn--ghost btn--sm" onclick="location.href='/'">Ферма</button>
</header>
<div class="page-head">
  <h1>История прогонов</h1>
  <div class="sub">Каждая проверка, запущенная со стены экранов или по API — смоук-тест,
    Maestro-флоу, команда, integration_test. Клик по строке разворачивает результат
    по каждому устройству: статус, лог, скачиваемые файлы.</div>
</div>
<div class="page-error" id="err"></div>
<div class="runs-filterbar">
  <select class="select" id="fStatus" onchange="setFilter('status', this.value)">
    <option value="">Все статусы</option>
    <option value="queued">В очереди</option>
    <option value="running">Выполняется</option>
    <option value="passed">Пройден</option>
    <option value="failed">Провален</option>
    <option value="error">Ошибка</option>
    <option value="canceled">Отменён</option>
  </select>
  <select class="select" id="fType" onchange="setFilter('type', this.value)">
    <option value="">Все типы</option>
    <option value="install_smoke">Смоук-тест</option>
    <option value="maestro">Maestro</option>
    <option value="command">Команда</option>
    <option value="integration_test">Integration test</option>
  </select>
  <span class="sp"></span>
  <div class="runs-pager" id="pager"></div>
</div>
<div class="runs" id="runs"></div>

<script>
const want = new URLSearchParams(location.search).get("r");
const open = new Set(want ? [want] : []);
const ST = {
  passed: "пройден", failed: "провален", error: "ошибка", running: "выполняется",
  queued: "в очереди", canceled: "отменён", skipped: "пропущен", pending: "ожидание",
};
const stName = s => ST[s] || s;

// same vocabulary as tests.html's cards — a raw run.type slug means nothing
// to someone reading this list cold
const TYPE = {
  install_smoke:    { name: "Смоук-тест",      icon: `<rect x="7" y="2" width="10" height="20" rx="2"/><line x1="11" y1="18" x2="13" y2="18"/>` },
  maestro:           { name: "Maestro",          icon: `<polygon points="5 3 19 12 5 21 5 3"/>` },
  command:           { name: "Команда",          icon: `<polyline points="4 17 10 11 4 5"/><line x1="12" y1="19" x2="20" y2="19"/>` },
  integration_test:  { name: "Integration test", icon: `<path d="M9 2v4M15 2v4M9 22v-4M15 22v-4M2 9h4M2 15h4M22 9h-4M22 15h-4"/><rect x="6" y="6" width="12" height="12" rx="2"/>` },
};
const typeInfo = t => TYPE[t] || { name: t, icon: `<circle cx="12" cy="12" r="8"/>` };

const fmt = t => t ? new Date(t).toLocaleString() : "—";
const dur = (a, b) => {
  if (!a) return "";
  const s = Math.round(((b ? new Date(b) : new Date()) - new Date(a)) / 1000);
  return s < 60 ? s + "s" : Math.floor(s / 60) + "m " + (s % 60) + "s";
};

function devRow(runId, d) {
  const arts = (d.artifacts || []).map(n =>
    `<a href="/api/runs/${runId}/artifacts/${d.device_id}/${n}" target="_blank">${n}</a>`).join("");
  return `<div class="run-dev">
    <span class="did">${d.device_id}${d.package ? ` · ${d.package}` : ""}</span>
    <span class="pill ${d.status}">${stName(d.status)}</span>
    ${d.detail ? `<span class="ddetail">${d.detail}</span>` : ""}
    ${arts ? `<span class="darts">${arts}</span>` : ""}
  </div>`;
}

function runCard(r) {
  const isOpen = open.has(r.id);
  const info = typeInfo(r.type);
  const n = (r.devices || []).length;
  const devs = isOpen
    ? `<div class="run-devs">
        <div class="run-devs-head">${n} устройств${n === 1 ? "о" : n < 5 ? "а" : ""}</div>
        ${(r.devices || []).map(d => devRow(r.id, d)).join("")}
      </div>`
    : "";
  return `<div class="run" id="run-${r.id}">
    <div class="run-head" onclick="toggle('${r.id}')">
      <svg class="chevron ${isOpen ? "open" : ""}" width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 6 15 12 9 18"/></svg>
      <span class="type-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${info.icon}</svg></span>
      <span class="run-type">${info.name}</span>
      <span class="run-id">#${r.id}</span>
      <span class="pill ${r.status}">${stName(r.status)}</span>
      ${r.detail ? `<span class="run-type" style="font-weight:400;color:var(--text-muted)">— ${r.detail}</span>` : ""}
      <span class="run-when">${fmt(r.created_at)}<br>${dur(r.started_at, r.finished_at)}</span>
      <span class="run-act" onclick="event.stopPropagation()">
        ${["passed","failed","error","canceled"].includes(r.status)
          ? `<button class="btn" title="Запустить снова с теми же файлами" onclick="rerun('${r.id}')">Повторить</button>` : ""}
        ${["queued","running"].includes(r.status)
          ? `<button class="btn btn--danger" onclick="cancelRun('${r.id}')">Отменить</button>` : ""}
      </span>
    </div>${devs}
  </div>`;
}

function toggle(id) {
  open.has(id) ? open.delete(id) : open.add(id);
  render(LAST);
}

const csrf = () => (document.cookie.match(/(?:^|;\s*)poligon_csrf=([^;]+)/) || [])[1] || "";
async function post(path) {
  const r = await fetch(path, { method: "POST", headers: { "X-Poligon-CSRF": csrf() }, credentials: "same-origin" });
  const b = await r.json().catch(() => ({}));
  if (!r.ok) { alert(b.error || r.statusText); return null; }
  return b;
}
async function rerun(id) {
  const b = await post(`/api/runs/${id}/rerun`);
  if (b) { open.add(b.id); load(); }
}
async function cancelRun(id) { if (await post(`/api/runs/${id}/cancel`)) load(); }

let LAST = [];
function render(runs) {
  LAST = runs;
  const el = document.getElementById("runs");
  if (!runs.length) {
    el.innerHTML = filters.status || filters.type
      ? `<div class="empty2">ничего не найдено под этот фильтр</div>`
      : `<div class="empty2"><div class="big">прогонов пока нет</div>здесь появится история после первого запуска —
         откройте партию устройств на стене экранов и нажмите «Тесты»</div>`;
    return;
  }
  el.innerHTML = runs.map(runCard).join("");
}

// ---- filters + paging ----
const filters = { status: "", type: "" };
let page = 0;
const pageSize = 20;
let total = 0;

function setFilter(key, val) { filters[key] = val; page = 0; load(); }
function prevPage() { if (page > 0) { page--; load(); } }
function nextPage() { if ((page + 1) * pageSize < total) { page++; load(); } }
function renderPager() {
  const shown = LAST.length;
  const from = shown ? page * pageSize + 1 : 0;
  const to = page * pageSize + shown;
  document.getElementById("pager").innerHTML = `
    <span>${from}–${to} из ${total}</span>
    <button class="btn" ${page === 0 ? "disabled" : ""} onclick="prevPage()">← назад</button>
    <button class="btn" ${to >= total ? "disabled" : ""} onclick="nextPage()">вперёд →</button>`;
}

async function load() {
  try {
    const params = new URLSearchParams({ limit: pageSize, offset: page * pageSize });
    if (filters.status) params.set("status", filters.status);
    if (filters.type) params.set("type", filters.type);
    const b = await (await fetch(`/api/runs?${params}`, { credentials: "same-origin" })).json();
    document.getElementById("err").textContent = "";
    total = b.total || 0;
    render(b.runs || []);
    renderPager();
    const active = (b.runs || []).some(r => r.status === "running" || r.status === "queued");
    clearTimeout(window._t);
    window._t = setTimeout(load, active ? 2500 : 15000);
  } catch (e) {
    document.getElementById("err").textContent = e.message;
    window._t = setTimeout(load, 5000);
  }
}
load();
</script>
</body>
</html>
