<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>прогоны</title>
<link rel="stylesheet" href="/app.css">
<script src="/app.js"></script>
<style>
  html, body { height: 100%; }
  body { margin: 0; display: flex; flex-direction: column; overflow: hidden; }

  .head { flex: none; padding: 12px 14px; border-bottom: 1px solid var(--line); }
  .head .head-row { display: flex; align-items: center; gap: 10px; }
  .head h1 { margin: 0; font: 600 14px/1.3 var(--sans); color: var(--text); }
  .head .sp { margin-left: auto; }
  .head .sub { margin-top: 3px; font: 400 12px/1.4 var(--sans); color: var(--text-muted); }

  .toolbar { flex: none; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 10px 14px; background: var(--surface-2); border-bottom: 1px solid var(--line); }
  .toolbar .select { min-width: 0; flex: 1 1 140px; }
  .pager { flex: none; display: flex; align-items: center; gap: 6px; font: 400 11px/1 var(--mono); color: var(--text-2); }
  .pager .btn { height: 24px; padding: 0 8px; font-size: 11px; }

  .list { flex: 1; overflow: auto; padding: 10px 14px 40px; display: grid; gap: 8px; align-content: start; }

  .run { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-md); overflow: hidden; }
  .run.is-open { border-color: var(--line-2); }

  .run-summary {
    display: flex; align-items: center; flex-wrap: wrap; gap: 6px 10px;
    width: 100%; padding: 10px 12px; cursor: pointer;
    background: none; border: 0; text-align: left; font: inherit; color: inherit;
  }
  .run-summary:hover { background: var(--surface-2); }
  .chevron { flex: none; color: var(--text-muted); transition: transform .12s var(--ease); }
  .chevron.open { transform: rotate(90deg); }
  .type-icon { flex: none; width: 22px; height: 22px; border-radius: var(--r-xs); background: var(--inset); display: grid; place-items: center; color: var(--text-2); }
  .type-icon svg { width: 12px; height: 12px; }
  .type-name { font: 600 12.5px/1.3 var(--sans); color: var(--text); white-space: nowrap; }
  .counts { display: flex; gap: 6px; font: 600 11px/1 var(--mono); }
  .counts .n-pass { color: var(--ok); }
  .counts .n-fail { color: var(--down); }
  .counts .n-run { color: var(--warn); }
  .sp { flex: 1 1 auto; min-width: 8px; }
  .run-when { flex: none; font: 400 11px/1.4 var(--mono); color: var(--text-muted); text-align: right; }
  .run-sub { flex-basis: 100%; font: 400 11px/1.4 var(--mono); color: var(--text-muted); padding-left: 32px; margin-top: -2px; }

  .run-body { border-top: 1px solid var(--line); padding: 10px 12px; display: grid; gap: 10px; }
  .run-actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .devices-label { font: 600 10px/1 var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--text-muted); }
  .device { border: 1px solid var(--line); border-radius: var(--r-sm); padding: 8px 10px; display: grid; gap: 6px; }
  .device-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font: 500 12px/1.3 var(--mono); }
  .device-head .did { color: var(--text); }
  .device-head .pkg { color: var(--text-muted); font-weight: 400; }
  .device-detail { font: 400 11.5px/1.5 var(--mono); color: var(--text-muted); white-space: pre-wrap; word-break: break-word; }
  .device-artifacts { display: flex; gap: 8px; flex-wrap: wrap; }
  .device-artifacts a { font: 500 11px/1 var(--mono); color: var(--text-2); text-decoration: underline; text-underline-offset: 2px; }
  .device-artifacts a:hover { color: var(--text); }

  .pill {
    display: inline-flex; align-items: center; gap: 5px; flex: none;
    font: 600 11px/1 var(--mono); letter-spacing: 0.04em; text-transform: uppercase;
    padding: 3px 7px; border-radius: var(--r-xs); border: 1px solid var(--line-2);
    color: var(--text-2); white-space: nowrap;
  }
  .pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--text-muted); flex: none; }
  .pill.passed  { color: var(--ok); border-color: rgba(63,185,138,.35); }
  .pill.passed::before { background: var(--ok); }
  .pill.failed, .pill.error { color: var(--down); border-color: rgba(229,84,75,.35); }
  .pill.failed::before, .pill.error::before { background: var(--down); }
  .pill.running, .pill.queued { color: var(--warn); border-color: rgba(217,154,43,.35); }
  .pill.running::before, .pill.queued::before { background: var(--warn); }
  .pill.canceled, .pill.skipped, .pill.pending { color: var(--text-muted); }

  .empty { padding: 32px 20px; text-align: center; color: var(--text-muted); font: 400 12.5px/1.6 var(--sans); }
  .empty .big { font: 600 13px/1.4 var(--sans); color: var(--text-2); margin-bottom: 6px; }
</style>
</head>
<body>
<div class="head">
  <div class="head-row">
    <h1>Прогоны</h1>
    <span class="sp"></span>
    <!-- only when this page is a tab of its own: inside the wall's drawer the
         wall is already one click away -->
    <a class="btn btn--sm" id="backLink" href="/" hidden>← Ферма</a>
  </div>
  <div class="sub">История всех тестов, запущенных со стены экранов. Клик по строке — результат по каждому устройству.</div>
</div>
<div class="toolbar">
  <select class="select" id="fStatus" onchange="setFilter('status', this.value)">
    <option value="">Все статусы</option>
    <option value="queued">В очереди</option>
    <option value="running">Выполняется</option>
    <option value="passed">Пройден</option>
    <option value="failed">Провален</option>
    <option value="error">Ошибка</option>
    <option value="canceled">Отменён</option>
  </select>
  <select class="select" id="fType" onchange="setFilter('type', this.value)">
    <option value="">Все типы</option>
    <option value="install_smoke">Смоук-тест</option>
    <option value="maestro">Maestro</option>
    <option value="command">Команда</option>
    <option value="integration_test">Integration test</option>
  </select>
</div>
<div class="page-error" id="err"></div>
<div class="list" id="list"></div>
<div class="toasts" id="toasts"></div>
<div class="toolbar" style="border-top:1px solid var(--line);border-bottom:0">
  <div class="pager" id="pager"></div>
</div>

<script>
if (window.parent === window) document.getElementById("backLink").hidden = false;

const want = new URLSearchParams(location.search).get("r");
const open = new Set(want ? [want] : []);

const ST = {
  passed: "пройден", failed: "провален", error: "ошибка", running: "выполняется",
  queued: "в очереди", canceled: "отменён", skipped: "пропущен", pending: "ожидание",
};
const stName = s => ST[s] || s;

// same vocabulary + icons as tests.html's cards
const TYPE = {
  install_smoke:    { name: "Смоук-тест",      icon: `<rect x="7" y="2" width="10" height="20" rx="2"/><line x1="11" y1="18" x2="13" y2="18"/>` },
  maestro:           { name: "Maestro",          icon: `<polygon points="5 3 19 12 5 21 5 3"/>` },
  command:           { name: "Команда",          icon: `<polyline points="4 17 10 11 4 5"/><line x1="12" y1="19" x2="20" y2="19"/>` },
  integration_test:  { name: "Integration test", icon: `<path d="M9 2v4M15 2v4M9 22v-4M15 22v-4M2 9h4M2 15h4M22 9h-4M22 15h-4"/><rect x="6" y="6" width="12" height="12" rx="2"/>` },
};
const typeInfo = t => TYPE[t] || { name: t, icon: `<circle cx="12" cy="12" r="8"/>` };

const fmt = t => t ? new Date(t).toLocaleString([], { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" }) : "—";
const dur = (a, b) => {
  if (!a) return "";
  const s = Math.round(((b ? new Date(b) : new Date()) - new Date(a)) / 1000);
  return s < 60 ? s + "s" : Math.floor(s / 60) + "m " + (s % 60) + "s";
};

// count devices by status so the collapsed row already answers "did it pass?"
function counts(devices) {
  const c = {};
  for (const d of devices || []) c[d.status] = (c[d.status] || 0) + 1;
  const parts = [];
  if (c.passed) parts.push(`<span class="n-pass">✓ ${c.passed}</span>`);
  if (c.failed || c.error) parts.push(`<span class="n-fail">✕ ${(c.failed || 0) + (c.error || 0)}</span>`);
  if (c.running || c.pending) parts.push(`<span class="n-run">… ${(c.running || 0) + (c.pending || 0)}</span>`);
  return parts.join("");
}

function deviceCard(runId, d) {
  const arts = (d.artifacts || []).map(n =>
    `<a href="/api/runs/${runId}/artifacts/${d.device_id}/${n}" target="_blank">${esc(n)}</a>`).join("");
  return `<div class="device">
    <div class="device-head">
      <span class="did">${esc(d.device_id)}</span>
      ${d.package ? `<span class="pkg">${esc(d.package)}</span>` : ""}
      <span class="sp"></span>
      <span class="pill ${d.status}">${stName(d.status)}</span>
    </div>
    ${d.detail ? `<div class="device-detail">${esc(d.detail)}</div>` : ""}
    ${arts ? `<div class="device-artifacts">${arts}</div>` : ""}
  </div>`;
}

function runCard(r) {
  const isOpen = open.has(r.id);
  const info = typeInfo(r.type);
  const n = (r.devices || []).length;
  const body = isOpen ? `
    <div class="run-body">
      <div class="run-actions">
        ${["passed","failed","error","canceled"].includes(r.status)
          ? `<button class="btn btn--sm" title="Запустить снова с теми же файлами" onclick="rerun('${r.id}')">Повторить</button>` : ""}
        ${["queued","running"].includes(r.status)
          ? `<button class="btn btn--sm btn--danger" onclick="cancelRun('${r.id}')">Отменить</button>` : ""}
      </div>
      <div>
        <div class="devices-label">${n} устройств${n === 1 ? "о" : n < 5 ? "а" : ""}</div>
        <div style="display:grid;gap:6px;margin-top:6px">${(r.devices || []).map(d => deviceCard(r.id, d)).join("")}</div>
      </div>
    </div>` : "";
  return `<div class="run ${isOpen ? "is-open" : ""}" id="run-${r.id}">
    <button class="run-summary" onclick="toggle('${r.id}')">
      <svg class="chevron ${isOpen ? "open" : ""}" width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 6 15 12 9 18"/></svg>
      <span class="type-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${info.icon}</svg></span>
      <span class="type-name">${info.name}</span>
      <span class="pill ${r.status}">${stName(r.status)}</span>
      <span class="counts">${counts(r.devices)}</span>
      <span class="sp"></span>
      <span class="run-when">${fmt(r.created_at)}</span>
      <span class="run-sub">#${esc(r.id)} · ${n} устр. · ${dur(r.started_at, r.finished_at) || "—"}${r.detail ? " · " + esc(r.detail) : ""}</span>
    </button>${body}
  </div>`;
}

function toggle(id) {
  open.has(id) ? open.delete(id) : open.add(id);
  render(LAST);
}

async function post(path) {
  const r = await fetch(path, { method: "POST", headers: HW(), credentials: "same-origin" });
  const b = await r.json().catch(() => ({}));
  if (!r.ok) { toast(b.error || r.statusText, "err"); return null; }
  return b;
}
async function rerun(id) {
  const b = await post(`/api/runs/${id}/rerun`);
  if (b) { open.add(b.id); load(); }
}
async function cancelRun(id) {
  const ok = await confirmDialog({
    title: "Отменить прогон?",
    body: "Уже запущенные шаги на устройствах будут прерваны. Собранные артефакты останутся.",
    okText: "Отменить прогон",
    cancelText: "Пусть идёт",
  });
  if (!ok) return;
  if (await post(`/api/runs/${id}/cancel`)) load();
}

let LAST = [];
function render(runs) {
  LAST = runs;
  const el = document.getElementById("list");
  if (!runs.length) {
    el.innerHTML = filters.status || filters.type
      ? `<div class="empty">ничего не найдено под этот фильтр</div>`
      : `<div class="empty"><div class="big">прогонов пока нет</div>откройте партию устройств на стене экранов и нажмите «Тесты», чтобы запустить первый</div>`;
    return;
  }
  el.innerHTML = runs.map(runCard).join("");
}

// ---- filters + paging ----
const filters = { status: "", type: "" };
let page = 0;
const pageSize = 20;
let total = 0;

function setFilter(key, val) { filters[key] = val; page = 0; load(); }
function prevPage() { if (page > 0) { page--; load(); } }
function nextPage() { if ((page + 1) * pageSize < total) { page++; load(); } }
function renderPager() {
  const shown = LAST.length;
  const from = shown ? page * pageSize + 1 : 0;
  const to = page * pageSize + shown;
  document.getElementById("pager").innerHTML = `
    <span>${from}–${to} из ${total}</span>
    <button class="btn" ${page === 0 ? "disabled" : ""} onclick="prevPage()">← назад</button>
    <button class="btn" ${to >= total ? "disabled" : ""} onclick="nextPage()">вперёд →</button>`;
}

async function load() {
  try {
    const params = new URLSearchParams({ limit: pageSize, offset: page * pageSize });
    if (filters.status) params.set("status", filters.status);
    if (filters.type) params.set("type", filters.type);
    const b = await (await fetch(`/api/runs?${params}`, { credentials: "same-origin" })).json();
    document.getElementById("err").textContent = "";
    total = b.total || 0;
    render(b.runs || []);
    renderPager();
    const active = (b.runs || []).some(r => r.status === "running" || r.status === "queued");
    clearTimeout(window._t);
    window._t = setTimeout(load, active ? 2500 : 15000);
  } catch (e) {
    document.getElementById("err").textContent = e.message;
    window._t = setTimeout(load, 5000);
  }
}
load();
</script>
</body>
</html>
