<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>poligon — screens</title>
<link rel="stylesheet" href="/app.css">
</head>
<body>
<header class="topbar">
  <span class="wordmark">poligon</span>
  <span class="readout" id="sub"></span>
  <span class="health" id="health" title="checking system…"></span>
  <span class="spacer"></span>
  <button class="btn btn--primary btn--sm" onclick="pickInstall()">Install build(s)</button>
  <button class="btn btn--sm" onclick="pickSmoke()">Smoke test</button>
  <button class="btn btn--sm" onclick="pickMaestro()">Maestro run</button>
  <button class="btn btn--ghost btn--sm" onclick="location.href='/runs.html'">Runs</button>
  <button class="btn btn--sm" onclick="restartAll()">Restart screens</button>
  <button class="btn btn--sm" onclick="reloadAll()">Reload</button>
  <button class="btn btn--ghost btn--sm" onclick="location.href='/'">Farm</button>
  <button class="btn btn--danger btn--sm" onclick="releaseAll()">Release all</button>
  <input type="file" id="installFile" hidden multiple accept=".apk,.aab,.apks,.ipa" onchange="installAll(this.files); this.value=''">
  <input type="file" id="smokeFile" hidden multiple accept=".apk,.aab,.apks,.ipa" onchange="startSmoke(this.files); this.value=''">
  <input type="file" id="maestroFile" hidden multiple accept=".yaml,.yml,.apk,.aab,.apks,.ipa" onchange="startMaestro(this.files); this.value=''">
</header>
<div class="page-error" id="err"></div>
<div class="wall" id="grid"></div>
<div class="toasts" id="toasts"></div>
<script>
const batch = new URLSearchParams(location.search).get("b");
const csrf = () => (document.cookie.match(/(?:^|;\s*)poligon_csrf=([^;]+)/) || [])[1] || "";
const H = {};
const HW = () => ({ "X-Poligon-CSRF": csrf() });
let devices = [];
const urls = {};
const sub = document.getElementById("sub");
const platExt = { android: [".apk", ".aab", ".apks"], ios: [".ipa"] };
function batchPlatforms() { return [...new Set(devices.map(d => d.platform))]; }
function defaultSub() {
  const by = {};
  for (const d of devices) by[d.platform] = (by[d.platform] || 0) + 1;
  const parts = Object.entries(by).map(([p, n]) => `${n} ${p}`);
  return parts.join(" · ") || `${devices.length} device(s)`;
}
function setSub(t) { sub.textContent = t || defaultSub(); }

function toast(msg, kind) {
  const el = document.createElement("div");
  el.className = "toast" + (kind ? " toast--" + kind : "");
  el.textContent = msg;
  document.getElementById("toasts").appendChild(el);
  setTimeout(() => { el.style.transition = "opacity .2s"; el.style.opacity = "0"; setTimeout(() => el.remove(), 220); }, kind === "err" ? 6000 : 3500);
}

async function screenURL(id) {
  try {
    const r = await fetch(`/api/devices/${id}/screen`, { headers: H });
    if (!r.ok) return null;
    return (await r.json()).url;
  } catch { return null; }
}

function cell(d, url) {
  const c = document.createElement("div");
  c.className = "tile";
  c.id = "cell-" + d.id;
  const noInput = d.specs && d.specs.input_injection === "blocked";
  const src = url && d.platform === "ios" ? url + (url.includes("?") ? "&" : "?") + "embed=1" : url;
  const body = url
    ? `<iframe id="if-${d.id}" src="${src}" allow="autoplay; clipboard-read; clipboard-write"></iframe>`
    : `<div class="tile-blank">screen unavailable</div>`;
  c.innerHTML = `
    <div class="tile-bar">
      <span class="id">${d.id}</span><span class="plat">${d.platform}</span>
      ${noInput ? `<span class="noinput" title="taps blocked by the OS — enable MIUI USB debugging (Security settings)">no input</span>` : ""}
      <span class="sp"></span>
      <button class="btn" onclick="window.open('/api/devices/${d.id}/screenshot','_blank')" title="open a screenshot">Shot</button>
      ${d.platform === "android" ? `<button class="btn" onclick="window.open('/api/devices/${d.id}/logcat','_blank')" title="download logcat since last grab">Log</button>` : ""}
      <button class="btn" onclick="reopen('${d.id}')">Reopen</button>
      <button class="btn" onclick="window.open(urls['${d.id}'],'w-${d.id}')">Pop out</button>
      <button class="btn btn--danger" onclick="releaseOne('${d.id}')">Release</button>
    </div>
    ${body}`;
  return c;
}

function reopen(id) {
  const f = document.getElementById("if-" + id);
  if (!f) return;
  const u = (f.getAttribute("src") || urls[id] || "").split("#")[0];
  if (u) f.src = u + (u.includes("?") ? "&" : "#") + "r=" + Date.now();
}
function reloadAll() { devices.forEach(d => reopen(d.id)); }

function pickInstall() { document.getElementById("installFile").click(); }

function platformOf(name) {
  const ext = name.slice(name.lastIndexOf(".")).toLowerCase();
  for (const [p, exts] of Object.entries(platExt)) if (exts.includes(ext)) return p;
  return null;
}

async function installAll(files) {
  files = [...(files || [])];
  if (!files.length) return;

  // classify + reject unknown / duplicate-platform uploads client-side
  const byPlat = {};
  for (const f of files) {
    const p = platformOf(f.name);
    if (!p) { toast(`${f.name}: not an .apk/.aab/.apks or .ipa`, "err"); return; }
    if (byPlat[p]) { toast(`two ${p} builds selected — pick one`, "err"); return; }
    byPlat[p] = f;
  }

  const need = batchPlatforms();
  const missing = need.filter(p => !byPlat[p]);
  if (missing.length) {
    toast(`batch has ${missing.join(" + ")} device(s) — add ${missing.map(p => p === "ios" ? "an .ipa" : "an .apk/.aab").join(" + ")}`, "err");
    return;
  }

  const label = files.map(f => f.name).join(" + ");
  toast(`Installing ${label} on ${devices.length} device(s)…`);
  setSub(`installing ${label}…`);
  const fd = new FormData();
  for (const f of files) fd.append("artifact", f);
  try {
    const r = await fetch(`/api/batches/${batch}/install`, { method: "POST", headers: HW(), body: fd });
    const b = await r.json();
    if (!r.ok && !b.results) throw new Error(b.error || r.statusText);
    const bad = (b.results || []).filter(x => x.status !== "ok" && x.status !== "skipped");
    toast(`Installed on ${b.ok}/${b.total}` + (bad.length ? "\n" + bad.map(x => `${x.device}: ${x.detail}`).join("\n") : ""),
      bad.length ? "err" : "ok");
  } catch (e) { toast(e.message, "err"); }
  setSub();
}

function pickSmoke() { document.getElementById("smokeFile").click(); }

async function startSmoke(files) {
  files = [...(files || [])];
  if (!files.length) return;
  const byPlat = {};
  for (const f of files) {
    const p = platformOf(f.name);
    if (!p) { toast(`${f.name}: not an .apk/.aab/.apks or .ipa`, "err"); return; }
    if (byPlat[p]) { toast(`two ${p} builds selected — pick one`, "err"); return; }
    byPlat[p] = f;
  }
  const missing = batchPlatforms().filter(p => !byPlat[p]);
  if (missing.length) {
    toast(`batch has ${missing.join(" + ")} device(s) — add a build for each`, "err");
    return;
  }
  const fd = new FormData();
  fd.append("type", "install_smoke");
  for (const d of devices) fd.append("device", d.id);
  for (const f of files) fd.append("artifact", f);
  toast(`Starting smoke test on ${devices.length} device(s)…`);
  try {
    const r = await fetch("/api/runs", { method: "POST", headers: HW(), body: fd });
    const b = await r.json();
    if (!r.ok) throw new Error(b.error || r.statusText);
    toast(`Run ${b.id} queued`, "ok");
    setTimeout(() => location.href = "/runs.html?r=" + b.id, 600);
  } catch (e) { toast(e.message, "err"); }
}

function pickMaestro() { document.getElementById("maestroFile").click(); }

async function startMaestro(files) {
  files = [...(files || [])];
  if (!files.length) return;
  const flows = files.filter(f => /\.ya?ml$/i.test(f.name));
  const builds = files.filter(f => !/\.ya?ml$/i.test(f.name));
  if (flows.length !== 1) { toast("pick exactly one .yaml flow (plus optional build(s))", "err"); return; }
  const byPlat = {};
  for (const f of builds) {
    const p = platformOf(f.name);
    if (!p) { toast(`${f.name}: not a build or a .yaml`, "err"); return; }
    if (byPlat[p]) { toast(`two ${p} builds selected`, "err"); return; }
    byPlat[p] = f;
  }
  const fd = new FormData();
  fd.append("type", "maestro");
  fd.append("flow", flows[0]);
  for (const f of builds) fd.append("artifact", f);
  for (const d of devices) fd.append("device", d.id);
  toast(`Starting Maestro run on ${devices.length} device(s)…`);
  try {
    const r = await fetch("/api/runs", { method: "POST", headers: HW(), body: fd });
    const b = await r.json();
    if (!r.ok) throw new Error(b.error || r.statusText);
    toast(`Run ${b.id} queued`, "ok");
    setTimeout(() => location.href = "/runs.html?r=" + b.id, 600);
  } catch (e) { toast(e.message, "err"); }
}

async function restartAll() {
  setSub("restarting screens…");
  await Promise.all(devices.map(async d => {
    try {
      const r = await fetch(`/api/devices/${d.id}/screen/restart`, { method: "POST", headers: HW() });
      if (!r.ok) return;
      for (let i = 0; i < 90; i++) {
        await new Promise(res => setTimeout(res, 2000));
        const j = await (await fetch(`/api/devices/${d.id}/job`, { headers: H })).json();
        if (j.state === "done" || j.state === "failed") break;
      }
      reopen(d.id);
    } catch {}
  }));
  setSub();
}

async function releaseOne(id) {
  try { await fetch(`/api/devices/${id}/release`, { method: "POST", headers: HW() }); } catch {}
  document.getElementById("cell-" + id)?.remove();
  devices = devices.filter(d => d.id !== id);
  setSub();
}

async function releaseAll() {
  try { await fetch(`/api/batches/${batch}/release`, { method: "POST", headers: HW() }); } catch {}
  localStorage.removeItem("poligon_batch");
  location.href = "/";
}

async function main() {
  if (!batch) { document.getElementById("err").textContent = "no batch"; return; }
  const b = await (await fetch(`/api/batches/${batch}`, { headers: H })).json();
  if (!b.devices) { document.getElementById("err").textContent = b.error || "batch not found"; return; }
  devices = b.devices;
  setSub();
  const grid = document.getElementById("grid");
  for (const d of devices) {
    const url = await screenURL(d.id);
    urls[d.id] = url || "";
    grid.appendChild(cell(d, url));
  }
  setInterval(() => {
    fetch(`/api/batches/${batch}/heartbeat`, { method: "POST", headers: HW() }).catch(() => {});
  }, 60000);
}
main().catch(e => document.getElementById("err").textContent = e.message);

async function pollHealth() {
  const el = document.getElementById("health");
  try {
    const h = await (await fetch("/healthz")).json();
    const bad = [];
    if (!h.ws_scrcpy) bad.push("ws-scrcpy sidecar down");
    if (!h.go_ios_tunnel) bad.push("go-ios tunnel down");
    if (h.ios_screens_ready < h.ios_screens_total) bad.push(`${h.ios_screens_total - h.ios_screens_ready} iOS screen(s) down`);
    el.className = "health " + (bad.length ? "health--warn" : "health--ok");
    el.title = bad.length ? bad.join(" · ") : "all systems ok";
  } catch {
    el.className = "health health--warn";
    el.title = "health check failed";
  }
}
pollHealth();
setInterval(pollHealth, 15000);
</script>
</body>
</html>
