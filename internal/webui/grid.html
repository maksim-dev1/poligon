<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>poligon — экраны</title>
<link rel="stylesheet" href="/app.css">
</head>
<body>
<div class="wall-pill" id="pill">
  <div class="zoom">
    <button class="icon-btn" title="Уменьшить" onclick="setZoom(-10)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="5" y1="12" x2="19" y2="12"/></svg>
    </button>
    <span class="pct" id="zoom">100%</span>
    <button class="icon-btn" title="Увеличить" onclick="setZoom(10)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
    </button>
  </div>
  <span class="divider"></span>
  <div class="wall-menu">
    <button class="btn btn--sm" onclick="toggleMenu()">Тесты
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
    </button>
    <div class="wall-menu-pop" id="menu" hidden>
      <button class="btn" onclick="pickSmoke();closeMenu()">Смоук-тест</button>
      <button class="btn" onclick="pickMaestro();closeMenu()">Maestro</button>
      <button class="btn" onclick="commandRun();closeMenu()">Команда</button>
      <button class="btn" onclick="location.href='/runs.html'">Прогоны</button>
    </div>
  </div>
  <span class="health" id="health" title="проверка системы…"></span>
  <span class="readout" id="sub"></span>
  <span class="divider"></span>
  <a class="btn btn--ghost btn--sm" href="/">Ферма</a>
  <button class="btn btn--danger btn--sm" onclick="releaseAll()">Завершить работу</button>
  <input type="file" id="smokeFile" hidden multiple accept=".apk,.aab,.apks,.ipa" onchange="startSmoke(this.files); this.value=''">
  <input type="file" id="maestroFile" hidden multiple accept=".yaml,.yml,.apk,.aab,.apks,.ipa" onchange="startMaestro(this.files); this.value=''">
  <input type="file" id="deviceInstallFile" hidden accept=".apk,.aab,.apks,.ipa" onchange="installOne(pendingInstallId, this.files[0]); this.value=''">
</div>
<div class="page-error" id="err"></div>
<div class="wall" id="grid"></div>
<div class="drawer" id="drawer" hidden>
  <div class="drawer-tabs" id="drawerTabs"></div>
  <div class="drawer-frames" id="drawerFrames"></div>
</div>
<div class="toasts" id="toasts"></div>
<script>
const batch = new URLSearchParams(location.search).get("b");
const csrf = () => (document.cookie.match(/(?:^|;\s*)poligon_csrf=([^;]+)/) || [])[1] || "";
const H = {};
const HW = () => ({ "X-Poligon-CSRF": csrf() });
let devices = [];
const urls = {};
const sub = document.getElementById("sub");
const platExt = { android: [".apk", ".aab", ".apks"], ios: [".ipa"] };
function batchPlatforms() { return [...new Set(devices.map(d => d.platform))]; }
function defaultSub() {
  const by = {};
  for (const d of devices) by[d.platform] = (by[d.platform] || 0) + 1;
  const parts = Object.entries(by).map(([p, n]) => `${n} ${p}`);
  return parts.join(" · ") || `${devices.length} устр.`;
}
function setSub(t) { sub.textContent = t || defaultSub(); }
function esc(s) { return String(s ?? "").replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;" }[c])); }

function toast(msg, kind) {
  const el = document.createElement("div");
  el.className = "toast" + (kind ? " toast--" + kind : "");
  el.textContent = msg;
  document.getElementById("toasts").appendChild(el);
  setTimeout(() => { el.style.transition = "opacity .2s"; el.style.opacity = "0"; setTimeout(() => el.remove(), 220); }, kind === "err" ? 6000 : 3500);
}

// ---- zoom ----
let zoom = +(localStorage.getItem("poligon_zoom") || 100);
function applyZoom() {
  zoom = Math.max(50, Math.min(200, Math.round(zoom / 10) * 10));
  document.getElementById("grid").style.setProperty("--tile-scale", (zoom / 100).toFixed(2));
  document.getElementById("zoom").textContent = zoom + "%";
  localStorage.setItem("poligon_zoom", zoom);
}
function setZoom(d) { zoom += d; applyZoom(); }

// ---- keep the wall clear of the floating pill (it can wrap to 2+ rows) ----
function fitWallTop() {
  const h = document.getElementById("pill").offsetHeight;
  document.getElementById("grid").style.setProperty("--wall-top", (h + 24) + "px");
}
new ResizeObserver(fitWallTop).observe(document.getElementById("pill"));
window.addEventListener("resize", fitWallTop);

// ---- run menu ----
function toggleMenu() { const m = document.getElementById("menu"); m.hidden = !m.hidden; }
function closeMenu() { document.getElementById("menu").hidden = true; }
document.addEventListener("click", e => { if (!e.target.closest(".wall-menu")) closeMenu(); });

function toggleInfo(id) { const el = document.getElementById("info-" + id); if (el) el.hidden = !el.hidden; }

// ---- terminal/files/etc. drawer — docked to the right, not a full-screen
// modal, so the device wall stays visible and usable while a tool is open.
// Tabbed: opening a second tool no longer kills the first one's state (a
// running WebSocket, an unsaved filter) — each tool is a real iframe kept
// alive in the background until its tab is explicitly closed.
const tools = new Map(); // key -> { tab, frame }
let activeTool = null;

function openModal(key, title, src) {
  document.getElementById("drawer").hidden = false;
  if (tools.has(key)) { activateTool(key); return; }

  const frame = document.createElement("iframe");
  frame.src = src;

  const tab = document.createElement("div");
  tab.className = "drawer-tab";
  const titleSpan = document.createElement("span");
  titleSpan.className = "drawer-tab-title";
  titleSpan.textContent = title;
  titleSpan.title = title;
  const closeBtn = document.createElement("button");
  closeBtn.className = "drawer-tab-close";
  closeBtn.textContent = "✕";
  closeBtn.title = "Закрыть";
  closeBtn.onclick = e => { e.stopPropagation(); closeTool(key); };
  tab.append(titleSpan, closeBtn);
  tab.onclick = () => activateTool(key);

  document.getElementById("drawerTabs").appendChild(tab);
  document.getElementById("drawerFrames").appendChild(frame);
  tools.set(key, { tab, frame });
  activateTool(key);
}
function activateTool(key) {
  activeTool = key;
  for (const [k, v] of tools) {
    v.tab.classList.toggle("active", k === key);
    v.frame.style.display = k === key ? "block" : "none";
  }
}
function closeTool(key) {
  const t = tools.get(key);
  if (!t) return;
  t.tab.remove();
  t.frame.remove();
  tools.delete(key);
  if (activeTool !== key) return;
  const next = [...tools.keys()].pop();
  if (next) activateTool(next);
  else { document.getElementById("drawer").hidden = true; activeTool = null; }
}
document.addEventListener("keydown", e => { if (e.key === "Escape" && activeTool) closeTool(activeTool); });

// ---- per-device install ----
let pendingInstallId = null;
function pickInstallFor(id) { pendingInstallId = id; document.getElementById("deviceInstallFile").click(); }

async function installOne(id, file) {
  if (!id || !file) return;
  const dev = devices.find(d => d.id === id);
  const p = platformOf(file.name);
  if (!p) { toast(`${file.name}: не .apk/.aab/.apks и не .ipa`, "err"); return; }
  if (dev && p !== dev.platform) { toast(`${file.name}: сборка ${p}, устройство ${dev.platform}`, "err"); return; }
  toast(`Устанавливаю ${file.name} на ${id}…`);
  const fd = new FormData();
  fd.append("artifact", file);
  try {
    const r = await fetch(`/api/devices/${id}/install`, { method: "POST", headers: HW(), body: fd });
    const b = await r.json();
    if (!r.ok) throw new Error(b.error || r.statusText);
    toast(`${id}: установлено`, "ok");
  } catch (e) { toast(`${id}: ${e.message}`, "err"); }
}

// ---- per-device screen restart ----
async function restartOne(id) {
  try {
    const r = await fetch(`/api/devices/${id}/screen/restart`, { method: "POST", headers: HW() });
    if (!r.ok) { const b = await r.json().catch(() => ({})); throw new Error(b.error || r.statusText); }
    toast(`${id}: перезапуск экрана…`);
    for (let i = 0; i < 90; i++) {
      await new Promise(res => setTimeout(res, 2000));
      const j = await (await fetch(`/api/devices/${id}/job`, { headers: H })).json();
      if (j.state === "done" || j.state === "failed") break;
    }
    reopen(id);
  } catch (e) { toast(`${id}: ${e.message}`, "err"); }
}

async function screenURL(id) {
  try {
    const r = await fetch(`/api/devices/${id}/screen`, { headers: H });
    if (!r.ok) return null;
    return (await r.json()).url;
  } catch { return null; }
}

function specRows(s) {
  s = s || {};
  const rows = [
    ["модель", s.model],
    ["ОС", s.os_version],
    ["soc", s.soc],
    ["ram", s.ram],
    ["экран", s.screen_size ? s.screen_size + (s.screen_density ? " @" + s.screen_density : "") : ""],
    ["батарея", s.battery >= 0 ? s.battery + "%" : ""],
  ].filter(([, v]) => v);
  return rows.map(([k, v]) => `<div class="row"><span class="k">${k}</span><span class="v">${esc(v)}</span></div>`).join("")
    || `<div class="row"><span class="k">нет данных</span><span class="v">—</span></div>`;
}

function cell(d, url) {
  const c = document.createElement("div");
  c.className = "cell";
  c.id = "cell-" + d.id;
  const noInput = d.specs && d.specs.input_injection === "blocked";
  const src = url && d.platform === "ios" ? url + (url.includes("?") ? "&" : "?") + "embed=1" : url;
  const body = url
    ? `<iframe id="if-${d.id}" src="${src}" allow="autoplay; clipboard-read; clipboard-write"></iframe>`
    : `<div class="tile-blank">экран недоступен</div>`;
  const icon = {
    x: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="6" y1="6" x2="18" y2="18"/><line x1="6" y1="18" x2="18" y2="6"/></svg>`,
    swap: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg>`,
    info: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><line x1="12" y1="11" x2="12" y2="16"/><line x1="12" y1="8" x2="12" y2="8"/></svg>`,
    cam: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>`,
    doc: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="8" y1="13" x2="16" y2="13"/><line x1="8" y1="17" x2="16" y2="17"/></svg>`,
    ext: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>`,
    install: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>`,
    restart: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>`,
    power: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="2" x2="12" y2="12"/><path d="M18.4 6.6a9 9 0 1 1-12.8 0"/></svg>`,
    volUp: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>`,
    volDown: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/></svg>`,
    back: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>`,
    home: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8"/></svg>`,
    recents: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="2"/></svg>`,
    term: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 17 10 11 4 5"/><line x1="12" y1="19" x2="20" y2="19"/></svg>`,
    folder: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>`,
    logs: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>`,
    apps: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>`,
    tree: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="6" y1="3" x2="6" y2="21"/><path d="M6 8h6"/><path d="M6 15h10"/></svg>`,
  };
  c.innerHTML = `
    <div class="tile-rail">
      <button class="icon-btn" title="Установить сборку" onclick="pickInstallFor('${d.id}')">${icon.install}</button>
      <button class="icon-btn" title="Перезапустить экран" onclick="restartOne('${d.id}')">${icon.restart}</button>
      <button class="icon-btn" title="Обновить" onclick="reopen('${d.id}')">${icon.swap}</button>
      <button class="icon-btn" title="Скриншот" onclick="window.open('/api/devices/${d.id}/screenshot','_blank')">${icon.cam}</button>
      ${d.platform === "android" ? `<button class="icon-btn" title="logcat с последнего снятия" onclick="window.open('/api/devices/${d.id}/logcat','_blank')">${icon.doc}</button>` : ""}
      <button class="icon-btn" title="Открыть в отдельном окне" onclick="window.open(urls['${d.id}'],'w-${d.id}')">${icon.ext}</button>
      <button class="icon-btn" title="Характеристики" onclick="toggleInfo('${d.id}')">${icon.info}</button>
      ${d.platform === "android" ? `
      <span class="tile-rail-sep"></span>
      <button class="icon-btn" title="Питание" onclick="keyEvent('${d.id}','power')">${icon.power}</button>
      <button class="icon-btn" title="Громче" onclick="keyEvent('${d.id}','volume_up')">${icon.volUp}</button>
      <button class="icon-btn" title="Тише" onclick="keyEvent('${d.id}','volume_down')">${icon.volDown}</button>
      <button class="icon-btn" title="Назад" onclick="keyEvent('${d.id}','back')">${icon.back}</button>
      <button class="icon-btn" title="Домой" onclick="keyEvent('${d.id}','home')">${icon.home}</button>
      <button class="icon-btn" title="Последние приложения" onclick="keyEvent('${d.id}','recents')">${icon.recents}</button>
      <span class="tile-rail-sep"></span>
      <button class="icon-btn" title="Терминал" onclick="openModal('term-${d.id}','Терминал — ${d.id}','/terminal.html?id=${d.id}')">${icon.term}</button>
      <button class="icon-btn" title="Файлы" onclick="openModal('files-${d.id}','Файлы — ${d.id}','/files.html?id=${d.id}')">${icon.folder}</button>
      <button class="icon-btn" title="Логи (live)" onclick="openModal('logcat-${d.id}','Logcat — ${d.id}','/logcat.html?id=${d.id}')">${icon.logs}</button>
      <button class="icon-btn" title="Приложения" onclick="openModal('apps-${d.id}','Приложения — ${d.id}','/apps.html?id=${d.id}')">${icon.apps}</button>
      <button class="icon-btn" title="UI dump" onclick="openModal('uidump-${d.id}','UI dump — ${d.id}','/uidump.html?id=${d.id}')">${icon.tree}</button>` : ""}
    </div>
    <div class="tile">
      <div class="tile-bar">
        <button class="icon-btn is-danger" title="Освободить устройство" onclick="releaseOne('${d.id}')">${icon.x}</button>
        <span class="id">${esc(d.id)}</span><span class="plat">${esc(d.platform)}</span>
        ${noInput ? `<span class="noinput" title="тапы блокирует ОС — включите отладку по USB в MIUI (настройки безопасности)">нет ввода</span>` : ""}
      </div>
      <div class="tile-info" id="info-${d.id}" hidden><div class="specs">${specRows(d.specs)}</div></div>
      ${body}
    </div>`;
  return c;
}

async function keyEvent(id, key) {
  try {
    const r = await fetch(`/api/devices/${id}/keyevent?key=${key}`, { method: "POST", headers: HW() });
    if (!r.ok) { const b = await r.json().catch(() => ({})); throw new Error(b.error || r.statusText); }
  } catch (e) { toast(`${id}: ${e.message}`, "err"); }
}

// ws-scrcpy draws its own on-screen control bar (power/volume/back/home/…)
// inside the player it serves — same-origin under /live/, so hide it there.
function hideScrcpyToolbar(ifr) {
  try {
    const doc = ifr.contentDocument;
    if (!doc || doc.getElementById("poligon-hide-toolbar")) return;
    const style = doc.createElement("style");
    style.id = "poligon-hide-toolbar";
    style.textContent = ".control-buttons-list{display:none!important}";
    (doc.head || doc.documentElement).appendChild(style);
  } catch {}
}

function reopen(id) {
  const f = document.getElementById("if-" + id);
  if (!f) return;
  const u = (f.getAttribute("src") || urls[id] || "").split("#")[0];
  if (u) f.src = u + (u.includes("?") ? "&" : "#") + "r=" + Date.now();
}
function platformOf(name) {
  const ext = name.slice(name.lastIndexOf(".")).toLowerCase();
  for (const [p, exts] of Object.entries(platExt)) if (exts.includes(ext)) return p;
  return null;
}

function pickSmoke() { document.getElementById("smokeFile").click(); }

async function startSmoke(files) {
  files = [...(files || [])];
  if (!files.length) return;
  const byPlat = {};
  for (const f of files) {
    const p = platformOf(f.name);
    if (!p) { toast(`${f.name}: не .apk/.aab/.apks и не .ipa`, "err"); return; }
    if (byPlat[p]) { toast(`выбрано две сборки ${p} — оставьте одну`, "err"); return; }
    byPlat[p] = f;
  }
  const missing = batchPlatforms().filter(p => !byPlat[p]);
  if (missing.length) {
    toast(`в партии есть устройства ${missing.join(" + ")} — добавьте сборку для каждой платформы`, "err");
    return;
  }
  const fd = new FormData();
  fd.append("type", "install_smoke");
  for (const d of devices) fd.append("device", d.id);
  for (const f of files) fd.append("artifact", f);
  toast(`Запускаю смоук-тест на ${devices.length} устр.…`);
  try {
    const r = await fetch("/api/runs", { method: "POST", headers: HW(), body: fd });
    const b = await r.json();
    if (!r.ok) throw new Error(b.error || r.statusText);
    toast(`Прогон ${b.id} в очереди`, "ok");
    setTimeout(() => location.href = "/runs.html?r=" + b.id, 600);
  } catch (e) { toast(e.message, "err"); }
}

function pickMaestro() { document.getElementById("maestroFile").click(); }

async function startMaestro(files) {
  files = [...(files || [])];
  if (!files.length) return;
  const flows = files.filter(f => /\.ya?ml$/i.test(f.name));
  const builds = files.filter(f => !/\.ya?ml$/i.test(f.name));
  if (flows.length !== 1) { toast("выберите ровно один .yaml-флоу (плюс необязательные сборки)", "err"); return; }
  const byPlat = {};
  for (const f of builds) {
    const p = platformOf(f.name);
    if (!p) { toast(`${f.name}: не сборка и не .yaml`, "err"); return; }
    if (byPlat[p]) { toast(`выбрано две сборки ${p}`, "err"); return; }
    byPlat[p] = f;
  }
  const fd = new FormData();
  fd.append("type", "maestro");
  fd.append("flow", flows[0]);
  for (const f of builds) fd.append("artifact", f);
  for (const d of devices) fd.append("device", d.id);
  toast(`Запускаю Maestro на ${devices.length} устр.…`);
  try {
    const r = await fetch("/api/runs", { method: "POST", headers: HW(), body: fd });
    const b = await r.json();
    if (!r.ok) throw new Error(b.error || r.statusText);
    toast(`Прогон ${b.id} в очереди`, "ok");
    setTimeout(() => location.href = "/runs.html?r=" + b.id, 600);
  } catch (e) { toast(e.message, "err"); }
}

async function commandRun() {
  const cmd = prompt("Команда, которая выполнится на каждом устройстве.\nОкружение: POLIGON_DEVICE_ID, ANDROID_SERIAL / DEVICE_UDID, POLIGON_RUN_DIR (cwd).\nФайлы в cwd собираются как артефакты.");
  if (!cmd) return;
  const fd = new FormData();
  fd.append("type", "command");
  fd.append("command", cmd);
  for (const d of devices) fd.append("device", d.id);
  toast(`Запускаю команду на ${devices.length} устр.…`);
  try {
    const r = await fetch("/api/runs", { method: "POST", headers: HW(), body: fd });
    const b = await r.json();
    if (!r.ok) throw new Error(b.error || r.statusText);
    toast(`Прогон ${b.id} в очереди`, "ok");
    setTimeout(() => location.href = "/runs.html?r=" + b.id, 600);
  } catch (e) { toast(e.message, "err"); }
}

async function releaseOne(id) {
  try { await fetch(`/api/devices/${id}/release`, { method: "POST", headers: HW() }); } catch {}
  document.getElementById("cell-" + id)?.remove();
  devices = devices.filter(d => d.id !== id);
  setSub();
}

async function releaseAll() {
  try { await fetch(`/api/batches/${batch}/release`, { method: "POST", headers: HW() }); } catch {}
  localStorage.removeItem("poligon_batch");
  location.href = "/";
}

async function main() {
  applyZoom();
  if (!batch) { document.getElementById("err").textContent = "нет партии"; return; }
  const b = await (await fetch(`/api/batches/${batch}`, { headers: H })).json();
  if (!b.devices) { document.getElementById("err").textContent = b.error || "партия не найдена"; return; }
  devices = b.devices;
  setSub();
  const grid = document.getElementById("grid");
  for (const d of devices) {
    const url = await screenURL(d.id);
    urls[d.id] = url || "";
    grid.appendChild(cell(d, url));
    if (d.platform === "android") {
      const ifr = document.getElementById("if-" + d.id);
      if (ifr) ifr.addEventListener("load", () => hideScrcpyToolbar(ifr));
    }
  }
  setInterval(() => {
    fetch(`/api/batches/${batch}/heartbeat`, { method: "POST", headers: HW() }).catch(() => {});
  }, 60000);
}
main().catch(e => document.getElementById("err").textContent = e.message);

async function pollHealth() {
  const el = document.getElementById("health");
  try {
    const h = await (await fetch("/healthz")).json();
    const bad = [];
    if (!h.ws_scrcpy) bad.push("ws-scrcpy sidecar недоступен");
    if (!h.go_ios_tunnel) bad.push("go-ios tunnel недоступен");
    if (h.ios_screens_ready < h.ios_screens_total) bad.push(`${h.ios_screens_total - h.ios_screens_ready} iOS-экран(ов) недоступно`);
    el.className = "health " + (bad.length ? "health--warn" : "health--ok");
    el.title = bad.length ? bad.join(" · ") : "все системы в норме";
  } catch {
    el.className = "health health--warn";
    el.title = "проверка системы не удалась";
  }
}
pollHealth();
setInterval(pollHealth, 15000);
</script>
