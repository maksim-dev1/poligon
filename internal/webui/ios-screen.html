<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>poligon — iOS-экран</title>
<link rel="stylesheet" href="/app.css">
</head>
<body class="ios-player">
<div class="player-bar">
  <span class="title" id="title">iOS-экран</span>
  <span class="status" id="status"></span>
  <span class="sp"></span>
  <button class="btn btn--sm" onclick="send({type:'home'})">Домой</button>
  <button class="btn btn--sm" onclick="send({type:'wake'})">Разбудить</button>
  <button class="btn btn--sm" id="restartBtn" onclick="restartAgent()">Перезапустить агент</button>
  <button class="btn btn--ghost btn--sm" onclick="location.reload()">Обновить</button>
</div>
<div class="page-error" id="err"></div>
<div class="player-stage"><img id="screen" alt="экран устройства" draggable="false"></div>
<div id="dot"></div>
<div class="player-down" id="down">
  <div><b>Трансляция экрана недоступна</b></div>
  <div class="msg" id="down-msg">WebDriverAgent не отвечает.</div>
  <button class="btn btn--primary" id="down-btn" onclick="restartAgent()">Перезапустить WebDriverAgent</button>
</div>

<script>
const qs = new URLSearchParams(location.search);
const id = qs.get("id") || location.pathname.split("/").pop();
if (qs.get("embed")) document.body.classList.add("embed");
const base = `/live/ios/${encodeURIComponent(id)}`;
const csrf = () => (document.cookie.match(/(?:^|;\s*)poligon_csrf=([^;]+)/) || [])[1] || "";
const img = document.getElementById("screen");
const statusEl = document.getElementById("status");
document.getElementById("title").textContent = id;

let dev = { w: 390, h: 844 };
let errStreak = 0;
let streaming = false;
const downEl = document.getElementById("down");

function pump() {
  if (!streaming) return;
  const next = new Image();
  next.onload = () => {
    img.src = next.src;
    statusEl.textContent = "трансляция";
    if (errStreak) { errStreak = 0; downEl.classList.remove("show"); }
    if (streaming) setTimeout(pump, 90);
  };
  next.onerror = () => {
    statusEl.textContent = "ошибка трансляции";
    if (++errStreak >= 6) { streaming = false; showDown("WebDriverAgent перестал отвечать.\nПерезапустите его, чтобы вернуть экран."); }
    else if (streaming) setTimeout(pump, 1000);
  };
  next.src = base + "/frame?t=" + Date.now();
}

async function init() {
  downEl.classList.remove("show");
  errStreak = 0;
  try {
    const r = await fetch(base + "/size");
    if (r.ok) { const s = await r.json(); dev = s; }
  } catch (e) {}
  if (!streaming) { streaming = true; pump(); }
}

function showDown(msg) {
  document.getElementById("down-msg").textContent = msg;
  downEl.classList.add("show");
}

async function restartAgent() {
  const btns = document.querySelectorAll("#restartBtn,#down-btn");
  btns.forEach(b => b.disabled = true);
  showDown("Перезапуск WebDriverAgent…");
  try {
    const r = await fetch(base + "/restart", { method: "POST", headers: { "X-Poligon-CSRF": csrf() } });
    if (!r.ok) throw new Error((await r.json()).error || r.statusText);
    for (let i = 0; i < 120; i++) {
      await new Promise(res => setTimeout(res, 2000));
      const jr = await fetch(base + "/job");
      if (jr.status === 403) throw new Error("бронь потеряна — вернитесь на ферму и забронируйте устройство заново");
      const j = await jr.json();
      if (j.step) document.getElementById("down-msg").textContent = "Перезапуск… " + j.step;
      if (j.state === "done") break;
      if (j.state === "failed") throw new Error(j.err || "перезапуск не удался");
    }
    errStreak = 0;
    init();
  } catch (e) {
    showDown("Перезапуск не удался:\n" + e.message);
  } finally {
    btns.forEach(b => b.disabled = false);
  }
}

// map a browser event to device points, accounting for object-fit:contain
// letterboxing inside the (full-size) <img> box
function toDevice(ev) {
  const r = img.getBoundingClientRect();
  const ir = dev.w / dev.h;           // device aspect (== frame aspect)
  const br = r.width / r.height;       // img box aspect
  let w = r.width, h = r.height, ox = 0, oy = 0;
  if (br > ir) { w = h * ir; ox = (r.width - w) / 2; }   // pillarbox (bars L/R)
  else         { h = w / ir; oy = (r.height - h) / 2; }  // letterbox (bars T/B)
  const x = (ev.clientX - r.left - ox) / w * dev.w;
  const y = (ev.clientY - r.top - oy) / h * dev.h;
  return { x: Math.max(0, Math.min(dev.w, x)), y: Math.max(0, Math.min(dev.h, y)) };
}

async function send(action) {
  try {
    const r = await fetch(base + "/input", {
      method: "POST", headers: { "Content-Type": "application/json", "X-Poligon-CSRF": csrf() },
      body: JSON.stringify(action),
    });
    if (!r.ok) document.getElementById("err").textContent = (await r.json()).error || r.statusText;
    else document.getElementById("err").textContent = "";
  } catch (e) { document.getElementById("err").textContent = e.message; }
}

const dot = document.getElementById("dot");
let down = null, last = null;

img.addEventListener("dragstart", e => e.preventDefault());
img.addEventListener("pointerdown", e => {
  e.preventDefault();
  down = { ...toDevice(e), t: Date.now(), cx: e.clientX, cy: e.clientY, moved: false };
  last = { x: e.clientX, y: e.clientY, t: Date.now() };
  dot.style.left = e.clientX + "px"; dot.style.top = e.clientY + "px"; dot.style.opacity = 1;
  img.setPointerCapture(e.pointerId);
});
img.addEventListener("pointermove", e => {
  if (!down) return;
  e.preventDefault();
  dot.style.left = e.clientX + "px"; dot.style.top = e.clientY + "px";
  if (Math.hypot(e.clientX - down.cx, e.clientY - down.cy) > 6) down.moved = true;
  last = { x: e.clientX, y: e.clientY, t: Date.now() };
});
img.addEventListener("pointerup", e => {
  if (!down) return;
  e.preventDefault();
  dot.style.opacity = 0;
  const up = toDevice(e);
  if (!down.moved) { send({ type: "tap", x: up.x, y: up.y }); down = null; return; }
  const held = (Date.now() - down.t) / 1000;
  const duration = held > 0.6 ? 0.4 : 0.08;
  send({ type: "swipe", x: down.x, y: down.y, x2: up.x, y2: up.y, duration });
  down = null;
});
img.addEventListener("pointercancel", () => { down = null; dot.style.opacity = 0; });

let wheelAcc = 0, wheelTimer = null, wheelPt = null;
img.addEventListener("wheel", e => {
  e.preventDefault();
  wheelPt = toDevice(e);
  wheelAcc += e.deltaY;
  clearTimeout(wheelTimer);
  wheelTimer = setTimeout(() => {
    const amount = Math.max(-260, Math.min(260, wheelAcc));
    const cx = wheelPt.x, cy = dev.h / 2;
    send({ type: "swipe", x: cx, y: cy + amount / 2, x2: cx, y2: cy - amount / 2, duration: 0.1 });
    wheelAcc = 0;
  }, 60);
}, { passive: false });

addEventListener("keydown", e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key.length === 1) send({ type: "text", text: e.key });
  else if (e.key === "Backspace") send({ type: "text", text: "\b" });
  else if (e.key === "Enter") send({ type: "text", text: "\n" });
});

init();
</script>
</body>
</html>
