<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>файлы</title>
<link rel="stylesheet" href="/app.css">
<style>
  html, body { height: 100%; }
  body { margin: 0; display: flex; flex-direction: column; overflow: hidden; }
  .toolbar { flex: none; display: flex; align-items: center; gap: 6px; padding: 8px 10px; background: var(--surface-2); border-bottom: 1px solid var(--line); }
  .toolbar .path { flex: 1; min-width: 0; }
  .quick { flex: none; }
  .list { flex: 1; overflow: auto; }
  .row { display: flex; align-items: center; gap: 8px; padding: 7px 12px; border-bottom: 1px solid var(--line); font: 400 12px/1.3 var(--mono); }
  .row:hover { background: var(--surface-2); }
  .row .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; cursor: pointer; color: var(--text); }
  .row.is-dir .name::before { content: "📁 "; }
  .row:not(.is-dir) .name::before { content: "📄 "; }
  .row .size { color: var(--text-muted); flex: none; font-size: 11px; }
  .row .rowbtn { flex: none; }
  .empty { padding: 24px; text-align: center; color: var(--text-muted); font: 400 12px/1.4 var(--mono); }
</style>
</head>
<body>
<div class="toolbar">
  <button class="icon-btn" title="Вверх" onclick="goUp()">
    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></svg>
  </button>
  <button class="icon-btn" title="Обновить" onclick="loadDir(curPath)">
    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg>
  </button>
  <input class="select path" id="pathInput" onkeydown="if(event.key==='Enter')loadDir(this.value)">
  <button class="btn btn--sm quick" onclick="loadDir('/sdcard')">sdcard</button>
  <button class="btn btn--sm quick" onclick="loadDir('/')">/</button>
  <button class="btn btn--sm" onclick="document.getElementById('uploadFile').click()">Загрузить</button>
  <input type="file" id="uploadFile" hidden onchange="uploadFile(this.files[0]); this.value=''">
</div>
<div class="list" id="list"></div>
<div class="toasts" id="toasts"></div>
<script>
const id = new URLSearchParams(location.search).get("id");
const csrf = () => (document.cookie.match(/(?:^|;\s*)poligon_csrf=([^;]+)/) || [])[1] || "";
const HW = () => ({ "X-Poligon-CSRF": csrf() });

function toast(msg, kind) {
  const el = document.createElement("div");
  el.className = "toast" + (kind ? " toast--" + kind : "");
  el.textContent = msg;
  document.getElementById("toasts").appendChild(el);
  setTimeout(() => { el.style.transition = "opacity .2s"; el.style.opacity = "0"; setTimeout(() => el.remove(), 220); }, kind === "err" ? 6000 : 3500);
}
function esc(s) { return String(s ?? "").replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;" }[c])); }
function humanSize(n) {
  if (n < 1024) return n + " B";
  const u = ["KB","MB","GB"]; let i = -1;
  do { n /= 1024; i++; } while (n >= 1024 && i < u.length - 1);
  return n.toFixed(1) + " " + u[i];
}

let curPath = "/sdcard";
function goUp() {
  if (curPath === "/") return;
  const parts = curPath.split("/").filter(Boolean); parts.pop();
  loadDir("/" + parts.join("/"));
}
async function loadDir(p) {
  if (!id) { document.getElementById("list").innerHTML = `<div class="empty">нет id устройства</div>`; return; }
  try {
    const r = await fetch(`/api/devices/${id}/files?path=${encodeURIComponent(p)}`);
    const b = await r.json();
    if (!r.ok) throw new Error(b.error || r.statusText);
    curPath = b.path;
    document.getElementById("pathInput").value = curPath;
    renderList(b.entries || []);
  } catch (e) { toast(e.message, "err"); }
}
function renderList(entries) {
  entries.sort((a, b) => (b.dir - a.dir) || a.name.localeCompare(b.name));
  const list = document.getElementById("list");
  if (!entries.length) { list.innerHTML = `<div class="empty">пусто</div>`; return; }
  list.innerHTML = entries.map(e => {
    const full = (curPath === "/" ? "" : curPath) + "/" + e.name;
    return `
    <div class="row ${e.dir ? "is-dir" : ""}">
      <span class="name" title="${esc(e.name)}" onclick="${e.dir ? `loadDir('${full}')` : `downloadFile('${full}')`}">${esc(e.name)}</span>
      ${e.dir ? "" : `<span class="size">${humanSize(e.size)}</span>`}
      <button class="icon-btn rowbtn" title="Переименовать" onclick="renameFile('${full}','${esc(e.name)}')">✎</button>
      <button class="icon-btn rowbtn is-danger" title="Удалить" onclick="deleteFile('${full}')">✕</button>
    </div>`;
  }).join("");
}
function downloadFile(full) {
  window.open(`/api/devices/${id}/files/download?path=${encodeURIComponent(full)}`, "_blank");
}
async function uploadFile(file) {
  if (!file) return;
  const fd = new FormData();
  fd.append("path", curPath);
  fd.append("file", file);
  toast(`Загружаю ${file.name}…`);
  try {
    const r = await fetch(`/api/devices/${id}/files/upload`, { method: "POST", headers: HW(), body: fd });
    const b = await r.json();
    if (!r.ok) throw new Error(b.error || r.statusText);
    toast("Загружено", "ok");
    loadDir(curPath);
  } catch (e) { toast(e.message, "err"); }
}
async function deleteFile(full) {
  if (!confirm(`Удалить ${full}?`)) return;
  try {
    const r = await fetch(`/api/devices/${id}/files/delete`, { method: "POST", headers: { ...HW(), "Content-Type": "application/json" }, body: JSON.stringify({ path: full }) });
    const b = await r.json();
    if (!r.ok) throw new Error(b.error || r.statusText);
    loadDir(curPath);
  } catch (e) { toast(e.message, "err"); }
}
async function renameFile(full, name) {
  const next = prompt("Новое имя", name);
  if (!next || next === name) return;
  try {
    const r = await fetch(`/api/devices/${id}/files/rename`, { method: "POST", headers: { ...HW(), "Content-Type": "application/json" }, body: JSON.stringify({ path: full, name: next }) });
    const b = await r.json();
    if (!r.ok) throw new Error(b.error || r.statusText);
    loadDir(curPath);
  } catch (e) { toast(e.message, "err"); }
}
loadDir(curPath);
</script>
</body>
</html>
