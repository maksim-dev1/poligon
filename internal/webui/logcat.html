<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>logcat</title>
<link rel="stylesheet" href="/app.css">
<style>
  html, body { height: 100%; }
  body { margin: 0; display: flex; flex-direction: column; background: var(--inset); overflow: hidden; font: 12px/1.5 var(--mono); }
  .bar { flex: none; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 8px 10px; background: var(--surface-2); border-bottom: 1px solid var(--line); }
  .bar .input { flex: 1; min-width: 120px; height: 28px; font-family: var(--mono); font-size: 12px; }
  .bar .status { flex: none; color: var(--text-muted); }
  .bar .matches { flex: none; color: var(--text-3); }
  #log { flex: 1; overflow: auto; padding: 8px 12px; white-space: pre; color: var(--text-2); }
  #log div { padding: 1px 0; }
  #log .hidden-line { display: none; }
  /* only shown when the view is scrolled away from the tail — clicking it
     jumps back and re-arms follow mode */
  .jump {
    position: fixed; right: 16px; bottom: 16px; z-index: 5;
    display: none;
  }
  .jump.show { display: inline-flex; }
</style>
</head>
<body>
<div class="bar">
  <span class="status" id="status">подключение…</span>
  <input id="filter" class="input" placeholder="фильтр (подстрока, регистр не важен)…" oninput="applyFilter()">
  <span class="matches" id="matches"></span>
  <button class="btn btn--sm" id="pauseBtn" onclick="togglePause()">Пауза</button>
  <button class="btn btn--sm" onclick="clearLog()">Очистить</button>
</div>
<div id="log"></div>
<button class="btn btn--sm btn--primary jump" id="jump" onclick="jumpToTail()">↓ К последним строкам</button>
<script>
const id = new URLSearchParams(location.search).get("id");
document.title = "logcat — " + (id || "?");
const logEl = document.getElementById("log");
const status = document.getElementById("status");
let paused = false, buf = [];
const MAX_LINES = 5000;

// follow the tail only while the reader is already at the tail — scrolling up
// to read something used to be undone by the next line that arrived
let follow = true;
logEl.addEventListener("scroll", () => {
  follow = logEl.scrollHeight - logEl.scrollTop - logEl.clientHeight < 24;
  document.getElementById("jump").classList.toggle("show", !follow);
});
function jumpToTail() {
  follow = true;
  logEl.scrollTop = logEl.scrollHeight;
  document.getElementById("jump").classList.remove("show");
}

function countMatches() {
  const q = document.getElementById("filter").value;
  const el = document.getElementById("matches");
  if (!q) { el.textContent = ""; return; }
  let n = 0;
  for (const line of logEl.children) if (!line.classList.contains("hidden-line")) n++;
  el.textContent = `${n} из ${logEl.children.length}`;
}
function applyFilter() {
  const q = document.getElementById("filter").value.toLowerCase();
  for (const line of logEl.children) {
    line.classList.toggle("hidden-line", q !== "" && !line.textContent.toLowerCase().includes(q));
  }
  countMatches();
}
function appendLine(text) {
  if (paused) { buf.push(text); return; }
  const div = document.createElement("div");
  div.textContent = text;
  const q = document.getElementById("filter").value.toLowerCase();
  if (q !== "" && !text.toLowerCase().includes(q)) div.classList.add("hidden-line");
  logEl.appendChild(div);
  while (logEl.children.length > MAX_LINES) logEl.removeChild(logEl.firstChild);
  if (follow) logEl.scrollTop = logEl.scrollHeight;
}
function togglePause() {
  paused = !paused;
  const btn = document.getElementById("pauseBtn");
  btn.textContent = paused ? `Продолжить${buf.length ? " (" + buf.length + ")" : ""}` : "Пауза";
  btn.classList.toggle("btn--primary", paused);
  if (!paused) { buf.forEach(appendLine); buf = []; countMatches(); }
}
function clearLog() { logEl.innerHTML = ""; countMatches(); }

function connect() {
  if (!id) { status.textContent = "нет id устройства"; return; }
  const scheme = location.protocol === "https:" ? "wss" : "ws";
  const ws = new WebSocket(`${scheme}://${location.host}/api/devices/${id}/logcat/stream`);
  ws.binaryType = "arraybuffer";
  const decoder = new TextDecoder();
  let carry = "";
  ws.onopen = () => { status.textContent = id + " — идёт"; };
  ws.onclose = () => { status.textContent = "остановлено"; };
  ws.onerror = () => { status.textContent = "ошибка соединения"; };
  ws.onmessage = ev => {
    carry += decoder.decode(ev.data, { stream: true });
    const lines = carry.split("\n");
    carry = lines.pop();
    lines.forEach(appendLine);
  };
  window.addEventListener("pagehide", () => { try { ws.close(); } catch {} });
}
connect();
</script>
</body>
</html>
