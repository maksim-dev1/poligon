<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>logcat</title>
<style>
  html, body { height: 100%; }
  body { margin: 0; display: flex; flex-direction: column; background: #0b0d11; overflow: hidden; font: 12px/1.5 ui-monospace, monospace; }
  .bar { flex: none; display: flex; align-items: center; gap: 8px; padding: 8px 10px; background: #14161b; border-bottom: 1px solid #262a33; }
  .bar input { flex: 1; min-width: 0; background: #0b0d11; border: 1px solid #262a33; border-radius: 6px; color: #d7dae0; padding: 6px 8px; font: inherit; }
  .bar button { flex: none; background: #1c1f26; border: 1px solid #262a33; border-radius: 6px; color: #d7dae0; padding: 6px 10px; font: inherit; cursor: pointer; }
  .bar button:hover { background: #262a33; }
  .bar .status { flex: none; color: #8a8f98; }
  #log { flex: 1; overflow: auto; padding: 8px 12px; white-space: pre; color: #c9cdd4; }
  #log div { padding: 1px 0; }
  #log .hit { color: #d7dae0; }
  #log .hidden-line { display: none; }
</style>
</head>
<body>
<div class="bar">
  <span class="status" id="status">подключение…</span>
  <input id="filter" placeholder="фильтр (подстрока, регистр не важен)…" oninput="applyFilter()">
  <button id="pauseBtn" onclick="togglePause()">Пауза</button>
  <button onclick="clearLog()">Очистить</button>
</div>
<div id="log"></div>
<script>
const id = new URLSearchParams(location.search).get("id");
document.title = "logcat — " + (id || "?");
const logEl = document.getElementById("log");
const status = document.getElementById("status");
let paused = false, buf = [];
const MAX_LINES = 5000;

function applyFilter() {
  const q = document.getElementById("filter").value.toLowerCase();
  for (const line of logEl.children) {
    line.classList.toggle("hidden-line", q !== "" && !line.textContent.toLowerCase().includes(q));
  }
}
function appendLine(text) {
  if (paused) { buf.push(text); return; }
  const div = document.createElement("div");
  div.textContent = text;
  const q = document.getElementById("filter").value.toLowerCase();
  if (q !== "" && !text.toLowerCase().includes(q)) div.classList.add("hidden-line");
  logEl.appendChild(div);
  while (logEl.children.length > MAX_LINES) logEl.removeChild(logEl.firstChild);
  logEl.scrollTop = logEl.scrollHeight;
}
function togglePause() {
  paused = !paused;
  document.getElementById("pauseBtn").textContent = paused ? "Продолжить" : "Пауза";
  if (!paused) { buf.forEach(appendLine); buf = []; }
}
function clearLog() { logEl.innerHTML = ""; }

function connect() {
  if (!id) { status.textContent = "нет id устройства"; return; }
  const scheme = location.protocol === "https:" ? "wss" : "ws";
  const ws = new WebSocket(`${scheme}://${location.host}/api/devices/${id}/logcat/stream`);
  ws.binaryType = "arraybuffer";
  const decoder = new TextDecoder();
  let carry = "";
  ws.onopen = () => { status.textContent = id + " — идёт"; };
  ws.onclose = () => { status.textContent = "остановлено"; };
  ws.onerror = () => { status.textContent = "ошибка соединения"; };
  ws.onmessage = ev => {
    carry += decoder.decode(ev.data, { stream: true });
    const lines = carry.split("\n");
    carry = lines.pop();
    lines.forEach(appendLine);
  };
  window.addEventListener("pagehide", () => { try { ws.close(); } catch {} });
}
connect();
</script>
</body>
</html>
