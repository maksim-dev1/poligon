<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>poligon</title>
<link rel="stylesheet" href="/app.css">
</head>
<body>

<div id="gate" class="auth-wrap" hidden>
  <form class="auth-card" onsubmit="submitGate();return false">
    <span class="wordmark">poligon</span>
    <h1 id="gate-title">Sign in</h1>
    <p class="sub" id="gate-sub">Your farm email and password.</p>
    <label class="field">
      <span class="field-label">Email</span>
      <input id="email-in" class="input" type="email" placeholder="you@example.com" autocomplete="username">
    </label>
    <label class="field">
      <span class="field-label">Password</span>
      <input id="pw-in" class="input" type="password" placeholder="••••••••••" autocomplete="current-password">
    </label>
    <label class="field" id="pw2-field" hidden>
      <span class="field-label">Repeat password</span>
      <input id="pw2-in" class="input" type="password" placeholder="••••••••••" autocomplete="new-password">
    </label>
    <button id="gate-go" class="btn btn--primary btn--block" type="submit">Continue</button>
    <div class="form-error" id="gate-err"></div>
    <p class="auth-alt"><a id="gate-switch" href="#" onclick="toggleGate();return false">No account? Create one</a></p>
  </form>
</div>

<div id="app" hidden>
  <header class="topbar">
    <span class="wordmark">poligon</span>
    <span class="readout" id="summary">loading…</span>
    <span class="health" id="health" title="checking system…"></span>
    <span class="spacer"></span>
    <button id="chpw" class="btn btn--ghost btn--sm" hidden onclick="changePassword()">Password</button>
    <button id="logout" class="btn btn--ghost btn--sm" hidden onclick="logout()">Sign out</button>
  </header>

  <div class="page-error" id="err"></div>

  <h2 class="section-label" id="cand-title" hidden>Intake<span class="count" id="cand-count"></span></h2>
  <main class="grid" id="candidates"></main>

  <h2 class="section-label" id="farm-title" hidden>Farm</h2>
  <main class="grid" id="pool"></main>
</div>

<div id="batchbar"></div>
<div class="toasts" id="toasts"></div>

<script>
let signedIn = false;
const csrf = () => (document.cookie.match(/(?:^|;\s*)poligon_csrf=([^;]+)/) || [])[1] || "";
const $ = id => document.getElementById(id);

function toast(msg, kind) {
  const el = document.createElement("div");
  el.className = "toast" + (kind ? " toast--" + kind : "");
  el.textContent = msg;
  $("toasts").appendChild(el);
  setTimeout(() => { el.style.transition = "opacity .2s"; el.style.opacity = "0"; setTimeout(() => el.remove(), 220); }, kind === "err" ? 6000 : 3500);
}

async function api(path, opts = {}) {
  const headers = { ...(opts.headers || {}) };
  if (opts.method && opts.method !== "GET") headers["X-Poligon-CSRF"] = csrf();
  const r = await fetch("/api" + path, { ...opts, headers });
  if (r.status === 401) { signedIn = false; showGate(); throw new Error("unauthorized"); }
  const body = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(body.error || r.statusText);
  return body;
}

function showGate() {
  $("gate").hidden = false;
  $("app").hidden = true;
  $("logout").hidden = true;
  $("chpw").hidden = true;
}
function showApp() {
  $("gate").hidden = true;
  $("app").hidden = false;
  $("logout").hidden = false;
  $("chpw").hidden = false;
}

let registerMode = false;
function toggleGate() {
  registerMode = !registerMode;
  $("gate-title").textContent = registerMode ? "Create account" : "Sign in";
  $("gate-sub").textContent = registerMode
    ? "Pick an email and a password (at least 10 characters)."
    : "Your farm email and password.";
  $("pw2-field").hidden = !registerMode;
  $("pw-in").setAttribute("autocomplete", registerMode ? "new-password" : "current-password");
  $("gate-go").textContent = registerMode ? "Create account & sign in" : "Continue";
  $("gate-switch").textContent = registerMode ? "Already have an account? Sign in" : "No account? Create one";
  $("gate-err").textContent = "";
}

async function submitGate() {
  const email = $("email-in").value.trim();
  const password = $("pw-in").value;
  const gerr = $("gate-err");
  if (!email || !password) return;
  gerr.textContent = "";
  if (registerMode) {
    if (password.length < 10) { gerr.textContent = "Password must be at least 10 characters."; return; }
    if (password !== $("pw2-in").value) { gerr.textContent = "Passwords don't match."; return; }
  }
  $("gate-go").disabled = true;
  try {
    const r = await fetch(registerMode ? "/auth/register" : "/auth/login", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ email, password }),
    });
    if (!r.ok) {
      const b = await r.json().catch(() => ({}));
      gerr.textContent = r.status === 429 ? "Too many attempts — wait a few minutes." : (b.error || "failed");
      return;
    }
    signedIn = true;
    showApp();
    refresh();
  } finally {
    $("gate-go").disabled = false;
  }
}

async function logout() {
  try { await fetch("/auth/logout", { method: "POST", headers: { "X-Poligon-CSRF": csrf() } }); } catch {}
  signedIn = false;
  showGate();
}

function changePassword() {
  const back = document.createElement("div");
  back.className = "modal-backdrop";
  back.innerHTML = `
    <form class="modal" onsubmit="return false">
      <h2>Change password</h2>
      <label class="field"><span class="field-label">Current password</span>
        <input class="input" type="password" id="cp-cur" autocomplete="current-password"></label>
      <label class="field"><span class="field-label">New password</span>
        <input class="input" type="password" id="cp-new" autocomplete="new-password" placeholder="at least 10 characters"></label>
      <div class="form-error" id="cp-err"></div>
      <div class="modal-actions">
        <button class="btn" type="button" id="cp-cancel">Cancel</button>
        <button class="btn btn--primary" type="submit" id="cp-save">Save</button>
      </div>
    </form>`;
  document.body.appendChild(back);
  const close = () => back.remove();
  back.addEventListener("click", e => { if (e.target === back) close(); });
  document.addEventListener("keydown", function esc(e) { if (e.key === "Escape") { close(); document.removeEventListener("keydown", esc); } });
  $("cp-cancel").onclick = close;
  back.querySelector(".modal").onsubmit = async () => {
    const cur = $("cp-cur").value, next = $("cp-new").value;
    if (!cur || next.length < 10) { $("cp-err").textContent = "New password must be at least 10 characters."; return; }
    $("cp-save").disabled = true;
    try {
      const r = await fetch("/auth/password", {
        method: "POST", headers: { "Content-Type": "application/json", "X-Poligon-CSRF": csrf() },
        body: JSON.stringify({ current: cur, new: next }),
      });
      const b = await r.json().catch(() => ({}));
      if (r.ok) { close(); toast("Password changed. Other sessions signed out.", "ok"); }
      else { $("cp-err").textContent = b.error || "Could not change password."; $("cp-save").disabled = false; }
    } catch (e) { $("cp-err").textContent = e.message; $("cp-save").disabled = false; }
  };
  $("cp-cur").focus();
}

function led(s) { return `<span class="led led--${s}">${s}</span>`; }
function esc(s) { return String(s ?? "").replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;" }[c])); }
function platTag(p) { return `<span class="plat">${esc(p)}</span>`; }

const sel = new Set();
let batch = localStorage.getItem("poligon_batch") || "";
let batchIds = [];
let batchDevs = [];
const PLAT_EXT = { android: [".apk", ".aab", ".apks"], ios: [".ipa"] };
let fastPoll = null;

// ---- farm card ----
function card(d) {
  const s = d.specs || {};
  const canReserve = d.status === "free";
  const selected = sel.has(d.id);
  const cls = ["card"];
  if (canReserve) cls.push("card--free", "card--selectable");
  else if (["offline", "degraded", "maintenance", "unauthorized"].includes(d.status)) cls.push("card--muted");
  if (selected) cls.push("card--selected");
  return `<div class="${cls.join(" ")}" ${canReserve ? `onclick="toggleSel('${d.id}')"` : ""}>
    <div class="card-head">
      <input type="checkbox" class="card-check" ${canReserve ? "" : "disabled"} ${selected ? "checked" : ""}
        onclick="event.stopPropagation()" onchange="toggleSel('${d.id}')">
      <span class="card-id">${platTag(d.platform)} ${esc(d.id)}</span>
      ${led(d.status)}
    </div>
    <div class="card-sub">${esc(s.model || "unknown model")} · ${esc(s.os_version || "?")}
      <span class="tag">${esc(d.source || "config")}</span></div>
    ${s.input_injection === "blocked" ? `<div class="hint">Screen mirrors but taps/swipes are blocked by the OS.
      MIUI: Developer options → enable <b>USB debugging (Security settings)</b> (needs a SIM + Mi account on the phone).</div>` : ""}
    <div class="specs">
      <div class="row"><span class="k">soc</span><span class="v">${esc(s.soc || "—")}</span></div>
      <div class="row"><span class="k">ram</span><span class="v">${esc(s.ram || "—")}</span></div>
      <div class="row"><span class="k">screen</span><span class="v">${esc(s.screen_size || "—")}${s.screen_density ? " @" + esc(s.screen_density) : ""}</span></div>
      <div class="row"><span class="k">battery</span><span class="v">${s.battery >= 0 ? s.battery + "%" : "—"}</span></div>
    </div>
    ${d.reservation ? `<div class="hold">held by <b>${esc(d.reservation.user)}</b></div>` : ""}
  </div>`;
}

// ---- candidate card ----
function candidateCard(d) {
  const j = d.job;
  const running = j && (j.state === "running" || j.state === "queued");
  const failed = j && j.state === "failed";
  const idcode = d.serial || d.udid || "";
  let prep = "";
  if (running) prep = `<div class="prep"><span class="spinner"></span><span>${esc(j.step || "preparing…")}</span></div>`;
  else if (failed) prep = `<div class="prep prep--failed">✗ ${esc(j.err || "preparation failed")}</div>`;
  const logHtml = j && j.log && j.log.length
    ? `<div class="joblog">${esc(j.log.slice(-12).join("\n"))}</div>` : "";
  return `<div class="card">
    <div class="card-head">
      <span class="card-id">${platTag(d.platform)} ${esc(d.id)}</span>
      ${led(d.status === "unauthorized" ? "unauthorized" : "candidate")}
    </div>
    <div class="card-sub"><code>${esc(idcode)}</code></div>
    ${d.status === "unauthorized" ? `<div class="hint">On the device: unlock, replug USB, then approve the debugging / Trust prompt.</div>` : ""}
    <div class="card-actions">
      <button class="btn btn--primary" ${running ? "disabled" : ""} onclick="adopt('${d.id}')">
        ${failed ? "Retry" : running ? "Preparing…" : "Connect to farm"}</button>
    </div>
    ${prep}${logHtml}
  </div>`;
}

function toggleSel(id) {
  sel.has(id) ? sel.delete(id) : sel.add(id);
  renderBar();
  refresh();
}

function renderBar() {
  const bar = $("batchbar");
  if (batch) {
    bar.innerHTML = `<div class="tray">
      <span class="tray-count">${batchIds.length}<span> in batch</span></span>
      <button class="btn btn--primary" onclick="openGrid()">Open screens</button>
      <button class="btn" onclick="pickBatchFile()">Install build(s)</button>
      <button class="btn btn--danger" onclick="releaseBatch()">Release all</button>
      <input type="file" id="bf" hidden multiple accept=".apk,.aab,.apks,.ipa" onchange="batchUpload(this.files); this.value=''">
    </div>`;
    return;
  }
  if (sel.size) {
    bar.innerHTML = `<div class="tray">
      <span class="tray-count">${sel.size}<span> selected</span></span>
      <button class="btn btn--primary" onclick="startTesting()">Start testing</button>
      <button class="btn btn--ghost" onclick="clearSel()">Clear</button>
    </div>`;
    return;
  }
  bar.innerHTML = "";
}
function clearSel() { sel.clear(); renderBar(); refresh(); }

async function startTesting() {
  const ids = [...sel];
  if (!ids.length) return;
  try {
    const res = await api("/batches", { method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ devices: ids }) });
    batch = res.batch; localStorage.setItem("poligon_batch", batch);
    sel.clear();
    location.href = "/live/grid?b=" + encodeURIComponent(batch);
  } catch (e) { toast(e.message, "err"); }
}

async function releaseBatch() {
  try { await api(`/batches/${batch}/release`, { method: "POST" }); } catch (e) {}
  batch = ""; batchIds = []; localStorage.removeItem("poligon_batch");
  refresh();
}
function pickBatchFile() { $("bf").click(); }
function platformOf(name) {
  const ext = name.slice(name.lastIndexOf(".")).toLowerCase();
  for (const [p, exts] of Object.entries(PLAT_EXT)) if (exts.includes(ext)) return p;
  return null;
}
async function batchUpload(files) {
  files = [...(files || [])];
  if (!files.length) return;

  const byPlat = {};
  for (const f of files) {
    const p = platformOf(f.name);
    if (!p) { toast(`${f.name}: not an .apk/.aab/.apks or .ipa`, "err"); return; }
    if (byPlat[p]) { toast(`two ${p} builds selected — pick one`, "err"); return; }
    byPlat[p] = f;
  }
  const need = [...new Set(batchDevs.map(d => d.platform))];
  const missing = need.filter(p => !byPlat[p]);
  if (missing.length) {
    toast(`batch has ${missing.join(" + ")} device(s) — add ${missing.map(p => p === "ios" ? "an .ipa" : "an .apk/.aab").join(" + ")}`, "err");
    return;
  }

  const label = files.map(f => f.name).join(" + ");
  toast(`Installing ${label} on ${batchIds.length} device(s)…`);
  const fd = new FormData();
  for (const f of files) fd.append("artifact", f);
  try {
    const res = await api(`/batches/${batch}/install`, { method: "POST", body: fd });
    const bad = (res.results || []).filter(r => r.status !== "ok" && r.status !== "skipped");
    toast(`Installed on ${res.ok}/${res.total}` + (bad.length ? "\n" + bad.map(r => `${r.device}: ${r.detail}`).join("\n") : ""),
      bad.length ? "err" : "ok");
  } catch (e) { toast(e.message, "err"); }
  refresh();
}
function openGrid() { location.href = "/live/grid?b=" + encodeURIComponent(batch); }

async function adopt(id) {
  try { await api(`/devices/${id}/adopt`, { method: "POST" }); refresh(); scheduleFastPoll(); }
  catch (e) { toast(e.message, "err"); }
}

function scheduleFastPoll() {
  if (fastPoll) return;
  fastPoll = setInterval(refresh, 2000);
}

async function refresh() {
  try {
    const pool = await api("/devices");
    $("err").textContent = "";
    if (batch) {
      try { const b = await api(`/batches/${batch}`); batchDevs = b.devices; batchIds = b.devices.map(d => d.id); }
      catch { batch = ""; batchIds = []; batchDevs = []; localStorage.removeItem("poligon_batch"); }
    }
    const cands = pool.filter(d => !d.adopted);
    const farm  = pool.filter(d => d.adopted);
    for (const id of [...sel]) if (!farm.find(d => d.id === id && d.status === "free")) sel.delete(id);

    $("candidates").innerHTML = cands.map(candidateCard).join("");
    $("pool").innerHTML = farm.length ? farm.map(card).join("")
      : `<div class="empty"><div class="big">no devices on the farm</div>plug a phone in — it shows up here to connect</div>`;
    $("cand-title").hidden = cands.length === 0;
    $("cand-count").textContent = cands.length ? cands.length : "";
    $("farm-title").hidden = false;

    const free = farm.filter(d => d.status === "free").length;
    const online = farm.filter(d => d.status !== "offline").length;
    $("summary").innerHTML =
      `<b>${online}</b> online<span class="sep">·</span><b>${free}</b> free` +
      (cands.length ? `<span class="sep">·</span><b>${cands.length}</b> new` : "");

    const anyJob = cands.some(d => d.job && (d.job.state === "running" || d.job.state === "queued"));
    if (!anyJob && fastPoll) { clearInterval(fastPoll); fastPoll = null; }
    if (anyJob) scheduleFastPoll();

    renderBar();
  } catch (e) {
    if (e.message !== "unauthorized") $("err").textContent = e.message;
  }
}

async function boot() {
  const r = await fetch("/auth/me").catch(() => null);
  if (!r || !r.ok) { showGate(); $("email-in").focus(); return; }
  signedIn = true;
  showApp();
  refresh();
}
boot();
setInterval(() => { if (signedIn) refresh(); }, 5000);

async function pollHealth() {
  const el = $("health");
  try {
    const h = await (await fetch("/healthz")).json();
    const bad = [];
    if (!h.ws_scrcpy) bad.push("ws-scrcpy sidecar down");
    if (!h.go_ios_tunnel) bad.push("go-ios tunnel down");
    if (h.ios_screens_ready < h.ios_screens_total) bad.push(`${h.ios_screens_total - h.ios_screens_ready} iOS screen(s) down`);
    el.className = "health " + (bad.length ? "health--warn" : "health--ok");
    el.title = bad.length ? bad.join(" · ") : `all systems ok · ${h.adb_devices ?? "?"} adb device(s)`;
  } catch {
    el.className = "health health--warn";
    el.title = "health check failed";
  }
}
pollHealth();
setInterval(pollHealth, 15000);
</script>
</body>
</html>
