<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>poligon — phone farm</title>
<style>
  :root { --bg:#0f1115; --card:#1a1d24; --line:#2a2f3a; --fg:#e6e8ec; --muted:#8b93a1;
          --free:#3fb950; --busy:#d29922; --off:#6e7681; --bad:#f85149; --accent:#388bfd; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg);
         font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
  header { padding:16px 24px; border-bottom:1px solid var(--line); display:flex; gap:12px; align-items:baseline; }
  header h1 { margin:0; font-size:18px; }
  header .muted { color:var(--muted); }
  h3.section { margin:22px 24px 0; font-size:12px; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); }
  main { padding:12px 24px 24px; display:grid; gap:16px;
         grid-template-columns:repeat(auto-fill,minmax(320px,1fr)); }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:16px; position:relative; }
  .card.selectable { cursor:pointer; }
  .card.selectable:hover { border-color:#3a414f; }
  .card.sel { outline:2px solid var(--accent); border-color:var(--accent); }
  .card h2 { margin:0 0 4px; font-size:15px; display:flex; justify-content:space-between; align-items:center; gap:8px; }
  .badge { font-size:11px; text-transform:uppercase; letter-spacing:.04em; padding:2px 8px; border-radius:20px; white-space:nowrap; }
  .b-free{background:rgba(63,185,80,.15);color:var(--free)}
  .b-busy,.b-reserved,.b-running{background:rgba(210,153,34,.15);color:var(--busy)}
  .b-offline{background:rgba(110,118,129,.15);color:var(--off)}
  .b-degraded,.b-maintenance,.b-unauthorized{background:rgba(248,81,73,.15);color:var(--bad)}
  .b-candidate{background:rgba(56,139,253,.15);color:var(--accent)}
  .src{font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:1px 5px}
  .hint{color:var(--busy);font-size:12px;margin-top:8px}
  .specs { color:var(--muted); font-size:13px; margin:8px 0 0; }
  .specs div { display:flex; justify-content:space-between; }
  .row { display:flex; gap:8px; margin-top:12px; flex-wrap:wrap; }
  button { background:#22262e; color:var(--fg); border:1px solid var(--line);
           border-radius:6px; padding:6px 12px; cursor:pointer; font-size:13px; }
  button:hover { background:#2b303a; }
  button:disabled { opacity:.4; cursor:not-allowed; }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  button.primary:hover { background:#4c9aff; }
  .hold { color:var(--muted); font-size:12px; margin-top:8px; }
  #err { color:var(--bad); padding:0 24px; }
  .prep { margin-top:10px; font-size:13px; display:flex; align-items:center; gap:8px; }
  .prep.failed { color:var(--bad); }
  .spinner { width:13px; height:13px; border:2px solid var(--line); border-top-color:var(--accent);
             border-radius:50%; animation:spin .8s linear infinite; flex:none; }
  @keyframes spin { to { transform:rotate(360deg); } }
  .joblog { margin-top:6px; max-height:96px; overflow:auto; font:11px/1.45 ui-monospace,Menlo,monospace;
            color:var(--muted); background:#0c0e12; border:1px solid var(--line); border-radius:6px; padding:6px 8px; white-space:pre-wrap; }
  #batchbar { position:sticky; bottom:0; background:#191c22; border-top:1px solid var(--line);
              padding:12px 24px; display:flex; gap:10px; align-items:center; z-index:5; }
</style>
</head>
<body>
<header>
  <h1>poligon</h1>
  <span class="muted" id="summary">loading…</span>
  <span style="margin-left:auto"></span>
  <button id="logout" hidden onclick="logout()">sign out</button>
</header>
<div id="err"></div>

<div id="gate" hidden style="max-width:360px;margin:15vh auto;text-align:center">
  <h2 style="font-weight:600">Sign in</h2>
  <p class="muted" style="font-size:13px">Paste your poligon token
    (<code>poligon user add &lt;name&gt;</code> on the host).</p>
  <input id="token-in" type="password" placeholder="token" autocomplete="off"
    style="width:100%;padding:8px;border-radius:6px;border:1px solid #2a2f3a;background:#1a1d24;color:#e6e8ec">
  <button style="margin-top:10px;width:100%" onclick="login()">Continue</button>
  <div id="gate-err" style="color:#f85149;font-size:13px;margin-top:8px"></div>
</div>

<div id="app" hidden>
  <h3 class="section" id="cand-title" hidden>New devices — connect to the farm</h3>
  <main id="candidates"></main>
  <h3 class="section" id="farm-title" hidden>Farm</h3>
  <main id="pool"></main>
</div>
<div id="batchbar" hidden></div>

<script>
let TOKEN = localStorage.getItem("poligon_token") || "";
const h = () => TOKEN ? { Authorization: "Bearer " + TOKEN } : {};

async function api(path, opts = {}) {
  const r = await fetch("/api" + path, { ...opts, headers: { ...h(), ...(opts.headers||{}) } });
  if (r.status === 401) { showGate(); throw new Error("unauthorized"); }
  const body = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(body.error || r.statusText);
  return body;
}

function showGate() {
  document.getElementById("gate").hidden = false;
  document.getElementById("app").hidden = true;
  document.getElementById("logout").hidden = true;
}
async function login() {
  const t = document.getElementById("token-in").value.trim();
  if (!t) return;
  const r = await fetch("/api/devices", { headers: { Authorization: "Bearer " + t } });
  if (!r.ok) { document.getElementById("gate-err").textContent = "invalid token"; return; }
  TOKEN = t; localStorage.setItem("poligon_token", t);
  await fetch("/api/session", { method: "POST", headers: { Authorization: "Bearer " + t } });
  document.getElementById("gate").hidden = true;
  document.getElementById("app").hidden = false;
  document.getElementById("logout").hidden = false;
  refresh();
}
function logout() { localStorage.removeItem("poligon_token"); TOKEN = ""; showGate(); }

function badge(s) { return `<span class="badge b-${s}">${s}</span>`; }
function esc(s) { return String(s ?? "").replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;" }[c])); }

const sel = new Set();               // device ids ticked for a new batch
let batch = localStorage.getItem("poligon_batch") || "";   // active batch id
let batchIds = [];                   // device ids in the active batch
let fastPoll = null;

// ---- farm card (adopted devices) ----
function card(d) {
  const s = d.specs || {};
  const held = d.reservation ? `held by ${esc(d.reservation.user)}` : "";
  const canReserve = d.status === "free";
  const canRelease = !!d.reservation;
  const selected = sel.has(d.id);
  return `<div class="card${canReserve ? " selectable" : ""}${selected ? " sel" : ""}"
       ${canReserve ? `onclick="toggleSel('${d.id}')"` : ""}>
    <h2>
      <label onclick="event.stopPropagation()"><input type="checkbox" ${canReserve ? "" : "disabled"}
        ${selected ? "checked" : ""} onchange="toggleSel('${d.id}')"> ${esc(d.id)}</label>
      ${badge(d.status)}
    </h2>
    <div class="muted">${d.platform} · ${esc(s.model || "?")} · ${esc(s.os_version || "?")}
      <span class="src">${d.source || "config"}</span></div>
    ${s.input_injection === "blocked" ? `<div class="hint">⚠ Screen shows but taps/swipes are blocked by the OS.
      On MIUI: Developer options → enable <b>USB debugging (Security settings)</b>
      (needs a SIM + Mi account signed in on the phone).</div>` : ""}
    <div class="specs">
      <div><span>SoC</span><span>${esc(s.soc || "—")}</span></div>
      <div><span>RAM</span><span>${esc(s.ram || "—")}</span></div>
      <div><span>Screen</span><span>${esc(s.screen_size || "—")} ${s.screen_density ? "@"+esc(s.screen_density) : ""}</span></div>
      <div><span>Battery</span><span>${s.battery >= 0 ? s.battery + "%" : "—"}</span></div>
    </div>
    ${held ? `<div class="hold">${held}</div>` : ""}
  </div>`;
}

// ---- candidate card (not yet adopted) ----
function candidateCard(d) {
  const j = d.job;
  const running = j && (j.state === "running" || j.state === "queued");
  const failed = j && j.state === "failed";
  const idcode = d.serial || d.udid || "";
  let prep = "";
  if (running) prep = `<div class="prep"><span class="spinner"></span><span>${esc(j.step || "preparing…")}</span></div>`;
  else if (failed) prep = `<div class="prep failed">✗ ${esc(j.err || "preparation failed")}</div>`;
  const logHtml = j && j.log && j.log.length
    ? `<div class="joblog">${esc(j.log.slice(-12).join("\n"))}</div>` : "";
  return `<div class="card">
    <h2>${esc(d.id)} ${badge("candidate")}</h2>
    <div class="muted">${d.platform} · <code>${esc(idcode)}</code>
      ${d.status === "unauthorized" ? badge("unauthorized") : ""}</div>
    ${d.status === "unauthorized" ? `<div class="hint">On the device: unlock, replug USB, then
      approve the debugging / Trust prompt.</div>` : ""}
    <div class="row">
      <button class="primary" ${running ? "disabled" : ""} onclick="adopt('${d.id}')">
        ${failed ? "Retry" : running ? "Preparing…" : "Connect to farm"}</button>
    </div>
    ${prep}${logHtml}
  </div>`;
}

function toggleSel(id) {
  sel.has(id) ? sel.delete(id) : sel.add(id);
  renderBar();
  // cheap local re-render of selection outline
  refresh();
}

function renderBar() {
  const bar = document.getElementById("batchbar");
  if (batch) {
    bar.hidden = false;
    bar.innerHTML =
      `<b>Batch:</b> ${batchIds.length} device(s) &nbsp;` +
      `<button class="primary" onclick="openGrid()">Open screens</button>` +
      `<button onclick="pickBatchFile()">Install to all</button>` +
      `<button onclick="releaseBatch()">Release all</button>` +
      `<input type="file" id="bf" hidden accept=".apk,.aab,.apks,.ipa" onchange="batchUpload(this.files[0])">`;
    return;
  }
  if (sel.size) {
    bar.hidden = false;
    bar.innerHTML = `<b>${sel.size} selected</b> &nbsp;` +
      `<button class="primary" onclick="startTesting()">Start testing (${sel.size})</button>` +
      `<button onclick="clearSel()">Clear</button>`;
    return;
  }
  bar.hidden = true;
}
function clearSel() { sel.clear(); renderBar(); refresh(); }

// select -> reserve -> straight to the screen grid (same tab)
async function startTesting() {
  const ids = [...sel];
  if (!ids.length) return;
  try {
    const res = await api("/batches", { method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ devices: ids }) });
    batch = res.batch; localStorage.setItem("poligon_batch", batch);
    sel.clear();
    location.href = "/live/grid?b=" + encodeURIComponent(batch);
  } catch (e) { alert(e.message); }
}

async function releaseBatch() {
  try { await api(`/batches/${batch}/release`, { method: "POST" }); } catch (e) {}
  batch = ""; batchIds = []; localStorage.removeItem("poligon_batch");
  refresh();
}
function pickBatchFile() { document.getElementById("bf").click(); }
async function batchUpload(file) {
  if (!file) return;
  const fd = new FormData(); fd.append("artifact", file);
  document.getElementById("summary").textContent = `installing ${file.name} on ${batchIds.length} devices…`;
  try {
    const res = await api(`/batches/${batch}/install`, { method: "POST", body: fd });
    alert(`installed on ${res.ok}/${res.total}\n` +
      res.results.filter(r => r.status !== "ok").map(r => `${r.device}: ${r.detail}`).join("\n"));
  } catch (e) { alert(e.message); }
  refresh();
}
function openGrid() { location.href = "/live/grid?b=" + encodeURIComponent(batch); }

async function adopt(id) {
  try { await api(`/devices/${id}/adopt`, { method: "POST" }); refresh(); scheduleFastPoll(); }
  catch (e) { alert(e.message); }
}

function scheduleFastPoll() {
  if (fastPoll) return;
  fastPoll = setInterval(refresh, 2000);
}

async function refresh() {
  try {
    const pool = await api("/devices");
    document.getElementById("err").textContent = "";
    if (batch) {
      try { const b = await api(`/batches/${batch}`); batchIds = b.devices.map(d => d.id); }
      catch { batch = ""; batchIds = []; localStorage.removeItem("poligon_batch"); }
    }
    const cands = pool.filter(d => !d.adopted);
    const farm  = pool.filter(d => d.adopted);
    // drop selections that are no longer free
    for (const id of [...sel]) if (!farm.find(d => d.id === id && d.status === "free")) sel.delete(id);

    document.getElementById("candidates").innerHTML = cands.map(candidateCard).join("");
    document.getElementById("pool").innerHTML = farm.map(card).join("");
    document.getElementById("cand-title").hidden = cands.length === 0;
    document.getElementById("farm-title").hidden = cands.length === 0; // only label the farm when there's a candidates list too

    const free = farm.filter(d => d.status === "free").length;
    document.getElementById("summary").textContent =
      `${farm.length} on farm · ${free} free` + (cands.length ? ` · ${cands.length} new` : "");
    document.getElementById("logout").hidden = false;

    const anyJob = cands.some(d => d.job && (d.job.state === "running" || d.job.state === "queued"));
    if (!anyJob && fastPoll) { clearInterval(fastPoll); fastPoll = null; }
    if (anyJob) scheduleFastPoll();

    renderBar();
  } catch (e) {
    if (e.message !== "unauthorized")
      document.getElementById("err").textContent = e.message;
  }
}

async function reserve(id) { try { await api(`/devices/${id}/reserve`, {method:"POST"}); refresh(); } catch(e){ alert(e.message); } }
async function release(id) { try { await api(`/devices/${id}/release`, {method:"POST"}); refresh(); } catch(e){ alert(e.message); } }
function pickFile(id) { document.getElementById("f-" + id).click(); }
async function screen(id) {
  try {
    const { url } = await api(`/devices/${id}/screen`);
    window.open(url, "poligon-screen-" + id, "width=420,height=860");
  } catch (e) { alert(e.message); }
}

async function upload(id, file) {
  if (!file) return;
  const fd = new FormData();
  fd.append("artifact", file);
  document.getElementById("summary").textContent = `installing ${file.name} on ${id}…`;
  try {
    const res = await api(`/devices/${id}/install`, { method:"POST", body: fd });
    alert(res.status === "ok" ? "installed" : "failed:\n" + res.detail);
  } catch (e) { alert(e.message); }
  refresh();
}

document.getElementById("token-in")?.addEventListener("keydown", e => { if (e.key === "Enter") login(); });

async function boot() {
  if (!TOKEN) { showGate(); return; }
  document.getElementById("app").hidden = false;
  await fetch("/api/session", { method: "POST", headers: { Authorization: "Bearer " + TOKEN } }).catch(() => {});
  refresh();
}
boot();
setInterval(() => { if (TOKEN) refresh(); }, 5000);
</script>
</body>
</html>
