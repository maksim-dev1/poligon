# poligon runtime config. Copy to config/devices.yaml and edit.

listen: ":8080"
db_path: "poligon.db"
storage_dir: "storage"
poll_interval: 10s
specs_interval: 1h
idle_timeout: 15m
max_lease: 4h
adb_path: "adb"

# Authentication. Open self-service signup (email + password) from the dashboard;
# no admin role. Host CLI (`poligon user ...`) handles moderation / resets.
auth:
  session_ttl: 336h        # absolute session lifetime (14d)
  session_idle: 24h        # sliding inactivity window
  # public_url: "https://poligon.corp"   # base for set-password links (defaults to localhost)

# Serve HTTPS directly. Leave unset to serve plain HTTP behind
# `tailscale serve` / Caddy (recommended for anything past the LAN).
# tls:
#   cert: "/etc/poligon/tls/cert.pem"
#   key:  "/etc/poligon/tls/key.pem"

devices:
  - id: pixel6-01
    platform: android
    serial: 1A2B3C4D5E
    tags: [phone, arm64, prod-like]

  - id: iphone12-01
    platform: ios
    udid: 00008101-000A4D0E1234ABCD
    tags: [phone]
